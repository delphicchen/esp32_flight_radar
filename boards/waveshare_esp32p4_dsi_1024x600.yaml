# =====================================================================
#  Board: Waveshare ESP32-P4-WIFI6-Touch-LCD-7B
#         ESP32-P4 (RISC-V) + 32 MB hex PSRAM
#         1024x600 MIPI-DSI (EK79007) panel + GT911 touch
#         Wi-Fi 6 / BT via an ESP32-C6 co-processor over SDIO (esp-hosted)
#
#  This board differs from the S3 boards in three big ways, all handled
#  here so common/core.yaml + the LVGL layout stay shared:
#    1. Display bus is MIPI-DSI, not parallel-RGB -> `mipi_dsi` platform
#       with the built-in Waveshare panel model (dimensions/timings/init).
#    2. Wi-Fi lives on an ESP32-C6 reached over SDIO -> `esp32_hosted`.
#    3. Screenshots read the DPI framebuffer instead of the parallel-RGB
#       one (RADAR_DISPLAY_RGB=3), and the microSD sits on the native
#       SDMMC bus rather than SPI -- see the sd_storage block below.
#
#  Wi-Fi over the C6, the panel, touch, microSD and screenshots are all
#  confirmed working on hardware. Backlight GPIO32 and I2C GPIO7/8 come
#  from the official Waveshare BSP header; the C6 SDIO pins come from the
#  published P4 family wiring, so cross-check those against your board
#  revision if Wi-Fi does not come up on yours.
#
#  Resolution / radar geometry come from radar-p4-7b.yaml.
#
#  >>> 這塊板子的維護分支是 `lvgl9`,不是這裡 <<<
#  本分支(main / ESPHome 2026.3.3 / LVGL 8)編得起來也跑得動,但**沒有 microSD
#  支援、也沒有截圖**:兩者都依賴 p1ngb4ck fork 的 sd_storage 元件,而它 import 的
#  VARIANT_ESP32S31 在 2026.3.3 不存在,載不起來。P4 專屬的修正(SD 的 on-chip LDO、
#  DSI framebuffer 截圖、觸控旋轉抵消)都只在 `lvgl9` 上。
#  This board is maintained on the `lvgl9` branch; here it works but has no microSD
#  or screenshot support. See the branch table in README.
# =====================================================================

# ---- Resolution-driven build flags for the C++ includes ----
esphome:
  platformio_options:
    build_flags:
      - "-DSCREEN_W=${disp_w}"
      - "-DSCREEN_H=${disp_h}"
      - "-DRADAR_CANVAS=${radar_canvas}"
      - "-DRADAR_DISPLAY_RGB=3"    # 3 = MIPI-DSI:截圖改讀 DPI framebuffer
      # 這兩項都跟著下方 lvgl: 區塊走,改那裡就要一起改(理由見 radar_fetch.h):
      #   這塊板子 display 與 lvgl 都是 little_endian → framebuffer 是原生 RGB565
      - "-DSHOT_SWAP_BYTES=0"
      #   lvgl: rotation: 180° → framebuffer 裡存的是顛倒的畫面,截圖要轉回來
      - "-DRADAR_SHOT_ROT180=1"
      # 板載 ES8311 codec + 功放 → 鬧鐘頁的喇叭下拉多一項 LOCAL SPEAKER(見 alarm.h)
      - "-DRADAR_LOCAL_SPK=1"
      # microSD 由下方的 sd_storage 元件掛在 /sdcard,radar_fetch.h 不自己掛載
      - "-DRADAR_SD_EXT=1"
      # 地圖 CDN(可在 radar-p4-7b.yaml substitutions.maps_base_url 覆寫)
      - '-DRADAR_MAPS_BASE=\"${maps_base_url}\"'

# ---- 本地覆寫元件 ----
# storage / sd_storage 取自 p1ngb4ck 的 ESPHome fork(釘 commit,見兩者 __init__.py
# 的檔首說明)。sd_storage.cpp 有一處本地修補:上游沒有設定 host.pwr_ctrl_handle,
# 而 P4 的 SD IO 電軌要靠晶片內部 LDO 供電,不開卡就不會回應。
external_components:
  - source:
      type: local
      path: components
    components: [storage, sd_storage]

esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      # microSD 要用 FATFS,而 ESPHome 對 IDF 建置做了兩層瘦身,兩層都要解:
      #  1) fatfs 元件預設不編進去(DEFAULT_EXCLUDED_IDF_COMPONENTS)→ 缺 esp_vfs_fat.h
      #  2) disable_fatfs 預設 true 會把 CONFIG_FATFS_VOLUME_COUNT 設成 0 → 掛不起來
      disable_fatfs: false
      include_builtin_idf_components: [fatfs]
    sdkconfig_options:
      # FATFS 長檔名。IDF 預設是 CONFIG_FATFS_LFN_NONE(只支援 8.3 短檔名),
      # 此時 CONFIG_FATFS_MAX_LFN 這個巨集根本不存在,而 sd_storage 的目錄列舉
      # 直接引用它 → 編譯錯誤 "CONFIG_FATFS_MAX_LFN was not declared"。
      # (fork 是靠它自己改過的 esp32 元件設這個預設值,我們沒有搬那個元件。)
      # 順帶也讓截圖檔名 shot_YYYYMMDD_HHMMSS.bmp 不會被截成 8.3。
      CONFIG_FATFS_LFN_NONE: "n"
      CONFIG_FATFS_LFN_HEAP: "y"
      CONFIG_FATFS_MAX_LFN: "255"
      # 沒有這一行,malloc() 永遠只用內部 RAM(P4 約 768KB),PSRAM 完全碰不到。
      # 四塊 S3 板檔一直都有設,只有這裡漏了 —— 在地圖還是編譯進 flash 的年代
      # 看不出來(rodata 不佔 RAM),v1.3.0 把地圖改成執行期載入之後,圖磚的
      # std::vector(這台實測 11537 個輪廓點 ≈ 92KB)加上 LVGL 9、esp-hosted
      # 的 WiFi 緩衝、TLS、FATFS,內部 RAM 就見底了。
      # 症狀:回波跑完(尖峰)之後,下一個要大塊緩衝的工作丟 std::bad_alloc,
      # 而例外是關閉的 → __wrap___cxa_allocate_exception → abort → 無限重開。
      CONFIG_SPIRAM_USE_MALLOC: "y"
      # 把 WiFi/LWIP 與 TLS 握手的緩衝也挪出內部 RAM(沿用 S3 板檔的作法)
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: "y"
      CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN: "y"

psram:
  mode: hex        # ESP32-P4 only supports HEX-mode PSRAM
  speed: 200MHz

# ---- Wi-Fi 6 / BT co-processor (ESP32-C6 over SDIO) ----
# `wifi:` in common/core.yaml requires this on the P4 (no native radio).
esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO54
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  slot: 1
  # bus_width 在 ESPHome 2026.3 的 esp32_hosted schema 已移除:D1/D2/D3 對應的
  # sdkconfig 鍵名本身就含 _4BIT_BUS_(見 esp32_hosted/__init__.py),4-bit 是
  # 隱含的,所以那個選項變成冗餘。給了會直接 config 失敗。
  # sdio_frequency 可選(預設 40MHz);若 Wi-Fi 不穩可調降。
  #
  # 注意:這裡是「P4 ↔ C6 之間的 SDIO」,不要跟 TF 卡插槽的 SDMMC 搞混——
  # TF 卡的腳位見下方 sd_storage,與 C6 用的這組完全不同。
  # 兩者都用 SDMMC 週邊,但 P4 有兩個 slot:C6 佔 slot 1,TF 卡走 slot 0,不衝突。

# ---- microSD (TF slot, native SDMMC) ----
# 三指截圖除了 :8081/screenshot.bmp 之外,另存一份 BMP 到卡上(見 radar_fetch.h
# 的 sd_save_shot;RADAR_SD_EXT=1 表示掛載交給這個元件,我們不自己掛)。
#
# 腳位來源:Espressif 官方 P4 BSP(esp-bsp/bsp/esp32_p4_function_ev_board/
# include/bsp/esp32_p4_function_ev_board.h:115-120)——
#     BSP_SD_D0..D3 = 39,40,41,42   BSP_SD_CMD = 44   BSP_SD_CLK = 43
# 與 Waveshare 官方 04_sdmmc 範例列的腳位相同,7B 沿用 EV Board 的接線。
#
# 電源:P4 的 SD IO 電軌由晶片內部 LDO 通道 4 供電。上游元件沒有處理這件事,
# 我們在 components/sd_storage/sd_storage.cpp 補上(該檔檔首有說明)。若開機
# log 出現 "on-chip LDO ch4 unavailable" 或掛載三次都失敗,先懷疑這個通道編號,
# 可用 build_flags 的 -DSD_STORAGE_P4_LDO_CHAN=<n> 覆寫。
sd_storage:
  type: sd_mmc
  id: tf_card
  clk_pin: GPIO43
  cmd_pin: GPIO44
  data0_pin: GPIO39
  data1_pin: GPIO40
  data2_pin: GPIO41
  data3_pin: GPIO42
  slot: 0
  mount_path: /sdcard


# ---- Backlight (real PWM GPIO on the P4 board) ----
# 腳位依官方 BSP(components.espressif.com 的 waveshare/esp32_p4_wifi6_touch_lcd_7b,
# include/bsp/esp32_p4_wifi6_touch_lcd_7b.h):
#     #define BSP_LCD_BACKLIGHT (GPIO_NUM_32)
#     #define BSP_LCD_RST       (GPIO_NUM_33)
# 且 BSP 的 bsp_display_brightness_init() 用 LEDC + flags.output_invert = 1、
# 5kHz 10-bit → 背光是低電位點亮,所以這裡 inverted: true 是對的。
# (先前寫 GPIO26 是憑 P4 家族的通用接線推測,那支腳在 7B 上沒接背光,
#  結果 PWR 開關與亮度滑桿都無效。)
output:
  - platform: ledc
    pin:
      number: GPIO32
      inverted: true            # Waveshare P4 backlight is active-low
    id: bl_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    output: bl_pwm
    name: Backlight
    restore_mode: RESTORE_DEFAULT_ON

# ---- Touch + audio codec share one I2C bus (GT911 0x5D/0x14, ES8311 0x18) ----
i2c:
  sda: GPIO7
  scl: GPIO8
  frequency: 400kHz

# =====================================================================
#  板載喇叭(鬧鐘目標可選 LOCAL SPEAKER)
#  腳位同樣來自官方 BSP header(waveshare/esp32_p4_wifi6_touch_lcd_7b):
#      BSP_I2S_MCLK 13 / BSP_I2S_SCLK 12 / BSP_I2S_LCLK 10 / BSP_I2S_DOUT 9
#      BSP_POWER_AMP_IO 53   (功放致能,高電位開)
#  ES8311 掛在跟觸控同一條 I2C(GPIO7/8)。rtttl 產生的是 16-bit / 單聲道 /
#  16 kHz PCM(見 ESPHome rtttl.cpp 的 SAMPLE_RATE),所以下面三者都設 16 kHz。
#  ESP32-P4 沒有 legacy I2S driver;ESPHome 2026.4+ 已整個移除 legacy 驅動,
#  連帶拿掉 use_legacy 選項(本分支用的 2026.6.5 若還寫著會驗證失敗)。
# =====================================================================
i2s_audio:
  - id: i2s_out
    i2s_mclk_pin: GPIO13
    i2s_bclk_pin: GPIO12
    i2s_lrclk_pin: GPIO10

audio_dac:
  - platform: es8311
    id: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: local_spk
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO9
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono

# 功放致能:只有響鈴時才上電,平常不通電免底噪
switch:
  - platform: gpio
    id: spk_pa
    pin: GPIO53
    restore_mode: ALWAYS_OFF
    internal: true

rtttl:
  id: alarm_tone
  speaker: local_spk
  gain: 0.6
  on_finished_playback:
    - switch.turn_off: spk_pa   # 一輪放完就切功放,避免兩輪之間的底噪

script:
  # 鬧鈴音:c6(1046 Hz)三短聲一組,重複約 9 秒;common/core.yaml 每 15 秒
  # 重播一次直到使用者按 DISMISS。想換旋律直接改這串 RTTTL 即可。
  - id: local_ring_start
    mode: single
    then:
      - switch.turn_on: spk_pa
      - rtttl.play: "radar:d=8,o=6,b=180:c,p,c,p,c,4p,c,p,c,p,c,4p,c,p,c,p,c,4p,c,p,c,p,c,4p,c,p,c,p,c,4p,c,p,c,p,c,4p,c,p,c,p,c,4p,c,p,c,p,c"
  - id: local_ring_stop
    mode: single
    then:
      - rtttl.stop:
      - switch.turn_off: spk_pa

touchscreen:
  - platform: gt911
    id: my_touch
    display: main_display
    update_interval: 20ms
    # GT911 實測四角 raw(畫面正立):
    #   左上 (27,13)    右上 (1013,12)
    #   左下 (23,593)   右下 (1010,597)
    # 用實測範圍做近似恆等映射。勿再把 x_max 拉低(曾用 970/985):整屏 X 被拉伸後,
    # 雷達區點選會偏到左側鄰機,SYS 雖好但選機全錯。右緣 SYS 改靠工具列置頂 +
    # 略擴 ext_click_area(見 common/core.yaml),不靠全局 calibration 硬拉。
    calibration:
      x_min: 25
      x_max: 1012
      y_min: 12
      y_max: 595
    #
    # >>> 這個分支「需要」鏡像,而 main 分支「不需要」,原因在旋轉做在哪一層 <<<
    #
    # ESPHome 的觸控基底類別完全不看顯示器旋轉,只套下面 transform: 裡明寫的東西
    # (touchscreen.cpp 的 add_raw_touch_position_,只用 swap_x_y_/invert_x_/invert_y_)。
    # 真正會動觸控座標的是 LVGL 元件本身:
    #     lvgl_esphome.cpp:443  rotate_coordinates(data->point.x, data->point.y)
    #     lvgl_esphome.cpp:105  180° → x = width - x - 1;  y = height - y - 1
    # 而它用的是「lvgl: 區塊的 rotation」。
    #   main  (LVGL 8):rotation 寫在 display: → LVGL 的 rotation_ 是 NONE → 不翻 → 免鏡像
    #   lvgl9 (LVGL 9):rotation 被迫搬到 lvgl: → LVGL 翻 180° → 要在這裡先翻回來
    # mirror_x + mirror_y 合起來就是 180° 旋轉,正好抵消。
    #
    # 所以:把 rotation 從 display: 搬到 lvgl: 的那次改動,順帶讓觸控多轉了一次。
    # 若哪天 rotation 又搬回 display:(或 LVGL 元件不再自己轉),這段要一起拿掉。
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      - lambda: |-
          if (!id(backlight).current_values.is_on()) {
            id(wake_ms) = millis();      // 剛喚醒,短時間內忽略 PWR 誤觸
            auto call = id(backlight).turn_on();
            call.perform();
            lv_obj_add_state((lv_obj_t *) id(pwr_btn), LV_STATE_CHECKED);
            lv_obj_set_style_text_color(id(pwr_btn_l), lv_color_hex(0x04180C), 0);
          }
    # 三指下滑 → 截圖(1.5 秒內平均 y 移動 70px 觸發一次)
    #
    # 注意這裡的方向與其他板子相反,原因是這塊板子多了 mirror_y:
    # 上面 transform 的 mirror_x/mirror_y 是為了抵消 LVGL 9 對「指標輸入」的
    # 180° 旋轉(見該處註解),但它作用在觸控元件內部(normalize_ 的 invert_y_),
    # 而這個 on_update 拿到的 tp.y 正是鏡像之後的值——它不經過 LVGL 那條路。
    # 結果:視覺上往下滑,tp.y 反而遞減。所以判斷式要反過來寫。
    # 若哪天拿掉了 mirror_y,這裡也要跟著改回 my - shot_y0。
    on_update:
      - lambda: |-
          int n = (int) touches.size();
          if (n >= 3) {
            float my = 0;
            for (auto &tp : touches) my += tp.y;
            my /= n;
            if (!id(shot_armed)) {
              id(shot_armed) = true;
              id(shot_y0) = my;
              id(shot_ms) = millis();
            } else if (id(shot_y0) - my > 70.0f && millis() - id(shot_ms) < 1500) {
              id(shot_armed) = false;
              id(take_screenshot).execute();
            }
          } else {
            id(shot_armed) = false;
          }
    on_release:
      - lambda: 'id(shot_armed) = false;'

# ---- MIPI-DSI PHY power rail (required by the DSI display on ESP32-P4) ----
esp_ldo:
  - channel: 3
    voltage: 2.5V

# ---- Display (MIPI-DSI, driven by LVGL) ----
# The panel model carries the resolution, DSI lanes, timings and init
# sequence for this exact board, so only the behaviour flags are set here.
display:
  - platform: mipi_dsi
    id: main_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    update_interval: never
    auto_clear_enabled: false
    # 位元組序:mipi_dsi 預設 little_endian,保持不動;改由下方 lvgl 區塊把
    # LVGL 也設成 little_endian,兩邊都不做交換,面板直接收原生 RGB565。
    # (曾試過把這裡改 big_endian 去配合 LVGL 的預設值,結果整片偏暗紅——
    #  綠 0x07E0 交換後成 0xE007 = R28/G0/B7,正是那個色偏,故撤回。)
    # 面板的掃描方向與 UI 座標相差 180 度:未旋轉時 UI 的上緣會出現在螢幕下緣。
    # 這個 model 在 ESPHome 標了 no_transform=True(EK79007 走 DPI,沒有 MADCTL
    # 之類的硬體鏡像可用),所以只能靠 LVGL 的軟體旋轉。
    # 代價:LVGL 會另外配一份與繪圖緩衝同大的旋轉緩衝,每次 flush 多一次搬移。
    # LVGL 9(ESPHome 2026.4+)起 rotation 必須寫在 lvgl: 區塊(display 有
    # rotation 時 lvgl 元件會直接報錯),見下方。

# ---- LVGL:旋轉與位元組序 ----
# rotation:面板掃描方向與 UI 差 180 度,LVGL 9 由 lvgl 元件自己轉(display 的
# rotation 已移到這裡)。注意它「同時」會把觸控座標一起翻(lvgl_esphome.cpp:443),
# 而 GT911 的 raw 原點本來就對齊 UI,所以上面的 touchscreen 必須加 mirror_x/mirror_y
# 把那一次翻轉抵消掉——理由詳見該處註解。
# (先前這裡預留了一句「若上機後發現觸控上下左右相反,就是重複轉了」——實機證實
#  確實如此,已在 touchscreen 那邊修正。)
# byte_order:LVGL 元件預設 big_endian(LV_COLOR_16_SWAP),mipi_dsi 是
# little_endian;兩邊不一致會讓 RGB565 高低位元組顛倒(綠變暗紅)。
# (LVGL 9 版會自動從 display 繼承 byte_order,這裡明寫是為了與註解對照;
#  萬一與 display 不一致,元件會在驗證階段直接報錯。)
lvgl:
  rotation: 180°
  byte_order: little_endian
