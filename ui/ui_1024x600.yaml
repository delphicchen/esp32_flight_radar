        # 底部狀態列:font_mono 18 的字寬 11.3px,面板可用寬度 292px ≈ 26 字。
        # 平時的 "AC:n  hh:mm:ss [SRC]" 塞得進去;截圖路徑之類的長訊息交給
        # long_mode SCROLL 左右捲動,不再直接被螢幕右緣切掉(原本 [A.LIVE] 會斷尾)。
