                        image_recolor: 0xFFEE00
                        image_recolor_opa: COVER
                        hidden: true
                    # 掃描式出現:遮罩由上而下退開、亮線跟在露出邊界上(radar_sil_scan())。
                    # 必須宣告在 image 之後才會疊在圖上面;遮罩顏色要與面板底色一致。
                    - obj:
