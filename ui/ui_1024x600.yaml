              radius: 8
              selected:
                bg_color: 0x00C060
                text_color: 0x04180C
            # 顯示名的 index 必須對齊 radar_bg::tz_posix() 的 POSIX 陣列
            # 括號內為標準時間偏移;有日光節約的時區(LONDON/PARIS/BERLIN/NEW YORK/
            # LOS ANGELES)夏季實際會 +1,實際換算由 tz_posix() 的 POSIX 字串處理
            options:
              - "TAIPEI (UTC+8)"
              - "TOKYO (UTC+9)"
              - "SHANGHAI (UTC+8)"
              - "HONG KONG (UTC+8)"
              - "SEOUL (UTC+9)"
              - "BANGKOK (UTC+7)"
              - "LONDON (UTC+0)"
              - "PARIS (UTC+1)"
              - "BERLIN (UTC+1)"
              - "NEW YORK (UTC-5)"
              - "LOS ANGELES (UTC-8)"
              - "UTC"
            on_value:
              - lambda: |-
                  int i = (int) x;
                  if (i == id(tz_sel)) return;          // set_selected_index 會回打,值沒變就跳過
                  id(tz_sel) = i;
                  id(rtc_time).set_timezone(radar_bg::tz_posix(i));
