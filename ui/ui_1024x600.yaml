        - label: { id: sel_l3, x: 625, y: 448, text: " ", text_font: font_mono, text_color: 0xD2E6D7 }
        - label: { id: sel_l4, x: 625, y: 483, text: " ", text_font: font_mono, text_color: 0xD2E6D7 }
