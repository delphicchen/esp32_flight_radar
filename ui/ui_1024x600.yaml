                  #endif

        # ===== 機型規格面板(按機型徽章後蓋住 ROUTE ~ DIST 那幾行;呼號與徽章刻意留在外面,
        # 徽章才能再按一次收回)=====
        # 輪廓圖是 A8(只有 alpha、沒有顏色)的點陣圖,LVGL 用 image_recolor 當填色 →
        # 亮黃色由這裡的樣式決定,不是圖檔本身。recolor 只有在 recolor_opa > 0 時才會被讀,
        # 兩個都要設。src 先指向 plane_img 佔位,執行期由 radar_fill_spec() 換成真正的機型。
