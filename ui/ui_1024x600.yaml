                        height: 3
                        bg_color: 0xFFEE00
                        bg_opa: COVER
                        border_width: 0
                        pad_all: 0
                        hidden: true
                        scrollbar_mode: "OFF"
              - label: { id: spec_l1, x: 143, y: 38, text: " ", text_font: font_mono, text_color: 0xD2E6D7 }
              - label: { id: spec_l2, x: 143, y: 65, text: " ", text_font: font_mono, text_color: 0xD2E6D7 }
