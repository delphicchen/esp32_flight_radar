                  text_font: font_small
                  text_color: 0xFFEE00
              # 輪廓的固定外框:圖本身會隨翼展改變大小(radar_sil_set() 直接縮好點陣圖,
              # 不用 LVGL 的 zoom——見 radar_fetch.h 的說明),靠 align: CENTER 讓小圖
              # 留在同一個位置置中,不會縮向左上角。外框透明、不吃觸控。
              - obj:
