# AUTO-GENERATED from ui/ui_800x480.yaml by tools/scale_layout.py (x1.25).
# Do not edit by hand — edit the source layout and re-run the script.
# Pixel geometry is scaled; tune on hardware if elements misalign.

# ---- LVGL UI ----
lvgl:
  displays: [main_display]
  touchscreens: [my_touch]
  bg_color: 0x040C08
  disp_bg_color: 0x040C08
  pages:
    - id: main_page
      bg_color: 0x040C08
      pad_all: 0
      widgets:
        # ===== 底圖層(最底層,不透明,常駐)=====
        # 底色+台灣輪廓+預混合回波+距離環/十字線全部烤在這張;
        # 混色/畫環在 radar_rebuild_base 一次做完,每幀渲染只剩不透明 blit
        - canvas:
            id: base_canvas
            x: 15
            y: 15
            width: 570
            height: 570
        # 掃描尾巴(4 條漸暗,程式每幀更新座標,角度見 common/core.yaml 的 TAIL_DEG)
        # 原本是 8 條、間隔 1°、線寬 5。每幀最貴的一項是 lv_draw_line:LVGL 是在
        # 「線的外接矩形」上跑遮罩混色,45° 時那個矩形約 160x160,而九條線的矩形
        # 幾乎完全重疊,等於同一片區域被反覆混色九次。條數減半 = 這項成本減半。
        # 為了讓扇形不出現梳齒狀空隙,間距加倍(1°→2°)時線寬也要跟著加寬:
        # 外緣 r=226 時 2° 的間距是 7.9px,線寬取 9 才能保住和原本一樣的 1.1px 重疊。
        # 顏色取原本 8 段漸層的偶數項,漸層的起點、終點和斜率都不變。
        - line: { id: tail0, opa: 60%, points: ["300, 300", "300, 25"], line_color: 0x007A3C, line_width: 11 }
        - line: { id: tail1, opa: 60%, points: ["300, 300", "300, 25"], line_color: 0x00592C, line_width: 11 }
        - line: { id: tail2, opa: 60%, points: ["300, 300", "300, 25"], line_color: 0x00391C, line_width: 11 }
        - line: { id: tail3, opa: 60%, points: ["300, 300", "300, 25"], line_color: 0x00190C, line_width: 11 }
        # 掃描線(100ms 轉動)
        - line:
            id: sweep_line
            points: ["300, 300", "300, 18"]
            line_color: 0x00A050
            line_width: 3
            opa: 80%
        # 航班標記 ×10:飛機圖示(依航向旋轉)+ ATC 資料標籤,可點選
        - obj:
            id: ac0
            x: -250
            y: -250
            width: 153
            height: 80
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            hidden: true
            clickable: true
            scrollbar_mode: "OFF"
            widgets:
              - image:
                  id: ai0
                  x: 0
                  y: 8
                  src: plane_img
              - obj:
                  id: sq0
                  x: 14
                  y: 21
                  width: 8
                  height: 8
                  bg_color: 0x00FF41
                  bg_opa: COVER
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  hidden: true
              - label:
                  id: ad0
                  x: 40
                  y: 5
                  text: ""
                  text_font: font_tiny
                  text_color: 0x9AE6B4
            on_click:
              - script.execute:
                  id: select_slot
                  slot: 0
