            { id(tr18_0), id(tr18_1), id(tr18_2), id(tr18_3), id(tr18_4), id(tr18_5) },
            { id(tr19_0), id(tr19_1), id(tr19_2), id(tr19_3), id(tr19_4), id(tr19_5) },
            { id(tr20_0), id(tr20_1), id(tr20_2), id(tr20_3), id(tr20_4), id(tr20_5) },
