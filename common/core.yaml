# =============================================================
# Flight Radar 桌面擺件 — Phase 1.5(UI 改用 LVGL,解決閃爍/延遲)
# 板子:esp32-s3-5inch-rgb-001(腳位/時序已實機驗證)
#
# 功能:
#   • WiFi 配置頁:熱點「Radar-Setup」(密碼 12345678)→ captive portal
#   • Home Assistant 自動發現;背光/重啟/WiFi訊號/螢幕按鈕 = HA 實體
#   • HA 氣候讀數示範:換掉 sensor.YOUR_TEMPERATURE_SENSOR
#   • LVGL UI:只重繪變動區域 → 無黑屏閃爍
#   • OTA:改韌體走 WiFi,esphome run 會自動選
# =============================================================

# OpenSky 憑證:先跑 python3 tools/sync_secrets_from_credentials.py
# (讀 credentials.json → 寫 secrets.yaml),再 esphome compile/run
substitutions:
  opensky_cid: !secret opensky_client_id
  opensky_sec: !secret opensky_client_secret
  # 地圖圖磚 CDN。官方預設無省界/河/路;自建後改成你的 Pages 位址即可
  # (見 tools/build_china_map_tiles.sh)。
  maps_base_url: "https://delphicchen.github.io/flight-radar-maps/v1"

esphome:
  name: flight-radar
  friendly_name: Flight Radar
  platformio_options:
    lib_deps:
      - kikuchan98/pngle@^1.0.0
    build_flags:
      - '-DRADAR_MAPS_BASE=\"${maps_base_url}\"'
    # ---- LVGL 9:平行繪圖單元(把渲染分到第二顆核心)----
    # LVGL 9 把繪製拆成 draw unit + draw task 佇列。開了 OS 之後,LVGL 會替每個
    # 軟體繪圖單元開一條 FreeRTOS 執行緒(lv_draw_sw.c 的 lv_draw_sw_init),
    # 任務就能同時被兩條執行緒消化;ESP32-S3/P4 都是雙核,第二顆核心原本閒著。
    # LVGL 8 沒有這個機制,所以這是「升級 9 才拿得到」的加速。
    #
    # 為什麼用 build_flags 而不是 lvgl: 的選項:ESPHome 沒有把這些開出來,但它
    # 產生 lv_conf.h 時會跳過任何已出現在 build_flags 裡的 LV_* 定義
    # (components/lvgl/__init__.py 的 generate_lv_conf_h),所以這裡設得進去。
    #
    # >>> 實測結論:在這個 UI 上反而更慢,預設關閉 <<<
    # 5B 實機:開了之後 lvgl 慢操作變成 631~708ms、掃描線的延遲感變重,而且兩條
    # 執行緒的 16KB 內部堆疊又把 TLS 擠爆(Dynamic Impl: alloc(16937) failed)。
    # 原因推測:本專案的畫面是「很多小任務」(標籤、線段),每個任務都要付一次
    # 執行緒同步成本,而任務本身的工作量很小,管理成本吃掉了平行化的好處。
    # 想再試就把下面四行取消註解(開機 log 的 dump_config 會印 SW draw units)。
    #build_flags:
    #  - "-DLV_USE_OS=2"                     # 2 = LV_OS_FREERTOS(lv_conf_internal.h)
    #  - "-DLV_DRAW_SW_DRAW_UNIT_CNT=2"      # 兩個軟體繪圖單元 = 兩條 swdraw 執行緒
    #  - "-DLV_USE_FREERTOS_TASK_NOTIFY=1"   # 用 task notify 同步,比號誌快;ESPHome
    #                                        # 預設會把它壓成 0,這裡設回 LVGL 的預設
    #  # 堆疊大小要 x4:LVGL 的 lv_freertos.c 把 usStackSize 除以 sizeof(StackType_t)
    #  # 才丟給 xTaskCreate(vanilla FreeRTOS 的堆疊深度以「字」計),但 ESP-IDF 的
    #  # xTaskCreate 收的是「位元組」。照 LVGL 預設 8KB 會變成實際 2KB → 繪圖執行緒
    #  # 爆堆疊。32768/4 = 實際 8KB/條,兩條共 16KB 內部 RAM。
    #  - "-DLV_DRAW_THREAD_STACK_SIZE=32768"
  includes:
    - map_tiles.h          # 取代 map_data.h:地圖改成執行期從 maps 分割區載入
    - aircraft_db.h        # 產生器:tools/make_aircraft_db.py(機型輪廓 + 規格表)
    - radar_fetch.h
    - alarm.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // 先把地圖從 maps 分割區載進來,再重建底圖 —— 順序不能反,否則第一張
          // 底圖會是空的,要等下一次座標/半徑變動才補上。沒有地圖(還沒下載過、
          // 或分割區是舊表)時陣列是空的,繪製迴圈自然不畫,不需要額外判斷。
          if (maptiles::load_from_partition()) {
            // 已經有地圖就把節流 key 補起來 —— maps_key 是 RAM global、開機歸零,
            // 不補的話每次重開機都會把同一份圖磚重抓一遍(實機上實際發生過)。
            char k[48];
            snprintf(k, sizeof(k), "%.1f,%.1f,L%d", maptiles::stored_lat,
                     maptiles::stored_lon, (int) maptiles::stored_level);
            id(maps_key) = k;
          }
          // 開機重建底圖(map_on/echo_on 已自 NVS 還原),同時蓋掉 PSRAM 未初始化雜訊
          // 喇叭下拉選單:字型無 FontAwesome 箭頭字形(U+F078),移除符號免警告
          LvDropdownType *dds[8] = { id(a0_dd), id(a1_dd), id(a2_dd), id(a3_dd), id(spk_dd), id(tz_dd),
                                     id(src_dd), id(unit_dd) };
          for (auto *d : dds) lv_dropdown_set_symbol(d->obj, nullptr);
          // 燒錄時寫入的 OpenSky 憑證:覆蓋 NVS 裡可能的空值,免螢幕手填
          {
            const char *cid = "${opensky_cid}";
            const char *sec = "${opensky_sec}";
            if (cid[0] != '\0' && sec[0] != '\0') {
              if (id(opensky_client_id).state != cid) {
                auto c = id(opensky_client_id).make_call();
                c.set_value(cid);
                c.perform();
              }
              if (id(opensky_client_secret).state != sec) {
                auto c = id(opensky_client_secret).make_call();
                c.set_value(sec);
                c.perform();
              }
            }
          }
          // 還原時區:NVS 的 index → POSIX TZ 執行期套用,並把下拉同步到該項
          id(rtc_time).set_timezone(radar_bg::tz_posix(id(tz_sel)));
          lv_dropdown_set_selected(id(tz_dd)->obj, id(tz_sel));
          // 鎖定所有頁面的捲動:避免三指截圖手勢把頁面拖出位移,截到偏移後的內容
          lv_obj_t *pgs[4] = { id(main_page)->obj, id(alarm_page)->obj,
                               id(config_page)->obj, id(settings_page)->obj };
          for (auto *p : pgs) lv_obj_clear_flag(p, LV_OBJ_FLAG_SCROLLABLE);
          radar_rebuild_base((lv_obj_t *) id(base_canvas), id(home_lat).state,
                             id(home_lon).state, id(radar_range).state,
                             id(map_on), id(echo_on),
                             atc_layer_mask(id(atc_on), id(atc_asp_on), id(atc_rwy_on), id(atc_apt_on), id(atc_fix_on)));
      - delay: 3s
      - lambda: |-
          lv_obj_add_state((lv_obj_t *) id(pwr_btn), LV_STATE_CHECKED);
          lv_obj_set_style_text_color(id(pwr_btn_l), lv_color_hex(0x04180C), 0);
          if (id(map_on)) {
            lv_obj_add_state((lv_obj_t *) id(map_btn), LV_STATE_CHECKED);
            lv_obj_set_style_text_color(id(map_btn_l), lv_color_hex(0x04180C), 0);
          }
          if (id(echo_on)) {
            lv_obj_add_state((lv_obj_t *) id(echo_btn), LV_STATE_CHECKED);
            lv_obj_set_style_text_color(id(echo_btn_l), lv_color_hex(0x04180C), 0);
          }
          if (id(persist_on)) {
            lv_obj_add_state((lv_obj_t *) id(persist_btn), LV_STATE_CHECKED);
            lv_obj_set_style_text_color(id(persist_btn_l), lv_color_hex(0x04180C), 0);
          }
          if (id(atc_on)) {
            lv_obj_add_state((lv_obj_t *) id(atc_btn), LV_STATE_CHECKED);
            lv_obj_set_style_text_color(id(atc_btn_l), lv_color_hex(0x04180C), 0);
          }
          // ATC 圖層開關按鈕:還原 NVS 儲存的勾選狀態
          struct { bool on; lv_obj_t *btn, *lbl; } lay[5] = {
            { id(atc_asp_on), (lv_obj_t *) id(asp_btn), id(asp_btn_l) },
            { id(atc_rwy_on), (lv_obj_t *) id(rwy_btn), id(rwy_btn_l) },
            { id(atc_apt_on), (lv_obj_t *) id(apt_btn), id(apt_btn_l) },
            { id(atc_fix_on), (lv_obj_t *) id(fix_btn), id(fix_btn_l) },
            { id(atc_route_on), (lv_obj_t *) id(route_btn), id(route_btn_l) },
          };
          for (auto &l : lay) {
            if (l.on) {
              lv_obj_add_state(l.btn, LV_STATE_CHECKED);
              lv_obj_set_style_text_color(l.lbl, lv_color_hex(0x201200), 0);   // amber 反白
            }
          }
          if (id(poll_when_off)) {
            lv_obj_add_state((lv_obj_t *) id(poff_btn), LV_STATE_CHECKED);
            lv_obj_set_style_text_color(id(poff_btn_l), lv_color_hex(0x04180C), 0);
          }
          // 工具列置頂,避免後期加入的覆蓋層/標籤搶走右上角觸控(尤其 SYS 靠右緣)
          lv_obj_t *tb[] = {
            (lv_obj_t *) id(map_btn), (lv_obj_t *) id(echo_btn),
            (lv_obj_t *) id(persist_btn), (lv_obj_t *) id(atc_btn),
            (lv_obj_t *) id(pwr_btn), (lv_obj_t *) id(info_btn),
          };
          for (auto *b : tb) {
            if (!b) continue;
            lv_obj_move_foreground(b);
            // 子 label 不吃觸控,點擊落到 button 本身
            uint32_t nc = lv_obj_get_child_cnt(b);
            for (uint32_t i = 0; i < nc; i++)
              lv_obj_clear_flag(lv_obj_get_child(b, i), LV_OBJ_FLAG_CLICKABLE);
          }
          // SRC / UNIT 下拉:同步到 NVS 還原的值(設定頁未開過也要正確)
          lv_dropdown_set_selected(id(src_dd)->obj, id(data_src));
          lv_dropdown_set_selected(id(unit_dd)->obj, id(units_imperial) ? 1 : 0);
      - script.execute: atc_panel_sync
      - lambda: |-
          #if !RADAR_BL_PWM
          // 背光無 PWM(CH422G 擴充腳,只能開/關)→ 用 LVGL top layer 的全螢幕
          // 黑色遮罩做「夜間模式」:蓋在所有頁面之上,清掉 CLICKABLE 才不吃觸控。
          // 注意這不是真的降背光(耗電不變),只降感知亮度。
          {
            lv_obj_t *ov = lv_obj_create(lv_layer_top());
            lv_obj_remove_style_all(ov);
            lv_obj_set_pos(ov, 0, 0);
            lv_obj_set_size(ov, SCREEN_W, SCREEN_H);
            lv_obj_set_style_bg_color(ov, lv_color_hex(0x000000), 0);
            lv_obj_clear_flag(ov, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(ov, LV_OBJ_FLAG_SCROLLABLE);
            int nl = id(night_level);
            if (nl < 5) nl = 5;
            if (nl > 100) nl = 100;
            lv_obj_set_style_bg_opa(ov, (lv_opa_t) ((100 - nl) / 95.0f * 200.0f), 0);
            id(night_ov) = ov;
          }
          #endif
      - lvgl.slider.update:
          id: bl_slider
          value: !lambda |-
            #if RADAR_BL_PWM
            // 真 PWM 背光:同步滑桿到 NVS 還原的背光亮度
            return id(backlight).current_values.get_brightness() * 100.0f;
            #else
            // 夜間模式:同步滑桿到 NVS 還原的暗化等級
            return (float) id(night_level);
            #endif

logger:
  level: INFO

wifi:
  ap:
    ssid: "Radar-Setup"
    password: "12345678"

captive_portal:

# 自訂分割表:為下載式地圖切出 `maps` 分割區(見 partitions.csv 與 PLAN_MAPTILES.md)。
# 放在 core 而不是各 board —— 這與板子無關,四塊 S3 板一致。
esp32:
  partitions: partitions.csv

web_server:
  port: 80

api:
  reboot_timeout: 0s
  # 沒有 encryption: 的裝置,新版 Home Assistant 的 ESPHome 整合會拒絕加入
  # (issue #7)。**不要**填 key: —— 留空由裝置自己產生、HA 加入時協商,
  # 這樣預編韌體裡不含任何金鑰,每台機器的金鑰也各不相同。
  # (作法出自 ESPHome 維護者 jesserockz 的回覆。)
  encryption:

ota:
  - platform: esphome

time:
  - platform: sntp
    id: rtc_time
    timezone: Asia/Taipei
    on_time:
      - seconds: '*'          # 每秒更新時鐘(LVGL 只重繪時鐘那塊區域)
        then:
          - lvgl.label.update:
              id: clock_label
              text: !lambda 'return id(rtc_time).now().strftime("%H:%M:%S");'
      - seconds: 0            # 每分鐘檢查鬧鐘
        then:
          - lambda: |-
              auto t = id(rtc_time).now();
              if (!t.is_valid() || id(alarm_ringing)) return;
              int iso = alarmpk::iso_today(t.day_of_week);
              uint32_t A[4] = { id(al0), id(al1), id(al2), id(al3) };
              std::string sp[4] = { id(al_spk0).state, id(al_spk1).state,
                                    id(al_spk2).state, id(al_spk3).state };
              for (int i = 0; i < 4; i++) {
                if (alarmpk::due(A[i], t.hour, t.minute, iso)) {
                  // 該組鬧鐘的專屬喇叭,留空 → 預設喇叭
                  id(ring_spk) = sp[i].empty() ? id(alarm_speaker).state : sp[i];
                  ESP_LOGI("alarm", "alarm %d fired -> %s", i, id(ring_spk).c_str());
                  id(start_alarm).execute();
                  break;
                }
              }

# ---- 可在網頁(http://flight-radar.local)或 HA 填寫的設定 ----
# 全部存 NVS,斷電保留,改了不用重編韌體
text:
  - platform: template
    name: OpenSky Client ID
    id: opensky_client_id
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${opensky_cid}"
    entity_category: config
  - platform: template
    name: OpenSky Client Secret
    id: opensky_client_secret
    mode: password
    optimistic: true
    restore_value: true
    initial_value: "${opensky_sec}"
    entity_category: config
  - platform: template
    name: HA URL                # HA 位址;空值=http://homeassistant.local:8123,不通請填 IP
    id: ha_url
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    name: HA Token              # HA 長期存取權杖(個人資料頁→安全性),供喇叭掃描用
    id: ha_token
    mode: password
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    name: Alarm Speaker         # 預設喇叭(media_player 實體);各組鬧鐘未指定時用它
    id: alarm_speaker
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    name: Alarm 1 Speaker       # 鬧鐘 1 專屬喇叭,留空 = 用 Alarm Speaker
    id: al_spk0
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    name: Alarm 2 Speaker
    id: al_spk1
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    name: Alarm 3 Speaker
    id: al_spk2
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    name: Alarm 4 Speaker
    id: al_spk3
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    name: Alarm Sound URL       # 鬧鈴音檔 URL(mp3),留空則只發 media_player 動作
    id: alarm_media
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config

number:
  - platform: template
    name: Home Latitude
    id: home_lat
    min_value: -90
    max_value: 90
    step: 0.0001
    initial_value: 25.0330      # 預設台北,請在網頁/HA 改成你家座標
    mode: box
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: |-
          if (millis() < 5000) return;
          // 舊回波的比例/位置已不對,底圖先不疊回波;新圖磚下載完成再重建
          radar_rebuild_base((lv_obj_t *) id(base_canvas), id(home_lat).state,
                             id(home_lon).state, id(radar_range).state,
                             id(map_on), false,
                             atc_layer_mask(id(atc_on), id(atc_asp_on), id(atc_rwy_on), id(atc_apt_on), id(atc_fix_on)));
          if (id(echo_on)) id(echo_refresh).execute();
          id(wx_last_ms) = 0;   // 座標變了,下一秒重抓天氣
  - platform: template
    name: Home Longitude
    id: home_lon
    min_value: -180
    max_value: 180
    step: 0.0001
    initial_value: 121.5654
    mode: box
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: |-
          if (millis() < 5000) return;
          // 舊回波的比例/位置已不對,底圖先不疊回波;新圖磚下載完成再重建
          radar_rebuild_base((lv_obj_t *) id(base_canvas), id(home_lat).state,
                             id(home_lon).state, id(radar_range).state,
                             id(map_on), false,
                             atc_layer_mask(id(atc_on), id(atc_asp_on), id(atc_rwy_on), id(atc_apt_on), id(atc_fix_on)));
          if (id(echo_on)) id(echo_refresh).execute();
          id(wx_last_ms) = 0;   // 座標變了,下一秒重抓天氣
  - platform: template
    name: Radar Range
    id: radar_range
    min_value: 10
    max_value: 500
    step: 5
    initial_value: 50           # 掃描半徑(km)
    unit_of_measurement: km
    mode: box
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: |-
          if (millis() < 5000) return;
          // 舊回波的比例/位置已不對,底圖先不疊回波;新圖磚下載完成再重建
          radar_rebuild_base((lv_obj_t *) id(base_canvas), id(home_lat).state,
                             id(home_lon).state, id(radar_range).state,
                             id(map_on), false,
                             atc_layer_mask(id(atc_on), id(atc_asp_on), id(atc_rwy_on), id(atc_apt_on), id(atc_fix_on)));
          if (id(echo_on)) id(echo_refresh).execute();
  - platform: template
    name: Poll Interval
    id: poll_interval
    min_value: 10
    max_value: 300
    step: 5
    initial_value: 30           # 抓取間隔(秒);30s=2880次/天(額度4000)
    unit_of_measurement: s
    mode: box
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    name: Poll Interval Alt
    id: poll_interval_alt
    min_value: 5
    max_value: 300
    step: 5
    initial_value: 15           # 免費來源(airplanes.live/adsb.lol)抓取間隔;無每日額度可較密
    unit_of_measurement: s
    mode: box
    optimistic: true
    restore_value: true
    entity_category: config

# ---- 航班資料抓取(OpenSky OAuth2)----
http_request:
  timeout: 20s
  verify_ssl: false
  watchdog_timeout: 30s    # 請求期間放寬看門狗,避免 TLS 慢時重啟
  buffer_size_rx: 8192
  buffer_size_tx: 8192     # OpenSky 的 JWT token 有 2~3KB,預設 512B 塞不下

globals:
  - { id: os_token,     type: std::string }
  - { id: os_token_exp, type: uint32_t, initial_value: '0' }   # millis秒
  - { id: ac_lat, type: 'std::vector<float>' }
  - { id: ac_lon, type: 'std::vector<float>' }
  - { id: ac_trk, type: 'std::vector<float>' }   # 航向(度)
  - { id: ac_vel, type: 'std::vector<float>' }   # 地速(m/s)
  - { id: ac_alt, type: 'std::vector<float>' }   # 高度(m)
  - { id: ac_cs,  type: 'std::vector<std::string>' }
  - { id: ac_sq,  type: 'std::vector<std::string>' }   # squawk(三家來源都有)
  - { id: ac_ty,  type: 'std::vector<std::string>' }   # ICAO 機型代碼(OpenSky 無,會是空字串)
  # 以下四項只有 readsb v2(airplanes.live / adsb.lol)提供,OpenSky 一律空值
  - { id: ac_reg,  type: 'std::vector<std::string>' }  # 註冊號(B-5416)
  - { id: ac_desc, type: 'std::vector<std::string>' }  # 機型全名,查表失敗時的後備
  - { id: ac_cat,  type: 'std::vector<std::string>' }  # ADS-B 發射器類別(A3…),通用輪廓用
  - { id: ac_hex,  type: 'std::vector<uint32_t>' }     # ICAO24 位址,查註冊國用
  - { id: ac_vr,  type: 'std::vector<float>' }   # 垂直速率(m/s)
  - { id: ac_lc,  type: 'std::vector<uint32_t>' } # last_contact(epoch秒),ATC 訊號延遲判斷
  - { id: slot_map, type: 'std::vector<int>' }   # 標記槽 -> 航班索引
  - { id: sel_cs_g, type: std::string }          # 選取中的呼號
  - { id: sel_hex_g, type: uint32_t, initial_value: '0' }  # 選取中的 ICAO24(呼號短暫消失時用來對)
  - { id: sel_hold_ms, type: uint32_t, initial_value: '0' } # 上次在 states 裡見到選中機的 millis
  - { id: spec_on, type: bool, initial_value: 'false' }  # 機型徽章按下 → 顯示輪廓與規格
  - { id: fetch_ms,    type: uint32_t, initial_value: '0' }
  - { id: poll_tick,   type: int,      initial_value: '0' }
  - { id: sweep_angle, type: float,    initial_value: '0' }
  - { id: ac_shown_n,  type: int,      initial_value: '0' }  # 圈内可见航班数(扫描线减负用)
  - { id: slot_angle, type: 'std::vector<float>' }   # 各槽方位角(度,-1=隱藏)
  - { id: slot_glow,  type: 'std::vector<float>' }   # 各槽掃描高亮 0~1
  - id: map_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: echo_on
    type: bool
    restore_value: true
    initial_value: 'false'
  # 真實雷達餘暉:慢速掃描 + 掃過才顯影、隨時間淡出(FADE 鈕)
  - id: persist_on
    type: bool
    restore_value: true
    initial_value: 'true'
  - { id: info_on, type: bool, initial_value: 'false' }   # i 鈕:右下面板顯示系統資訊
  - id: atc_on
    type: bool
    restore_value: true
    initial_value: 'false'
  # 三指下滑截圖手勢狀態
  - { id: shot_armed, type: bool,     initial_value: 'false' }
  - { id: shot_y0,    type: float,    initial_value: '0' }
  - { id: shot_ms,    type: uint32_t, initial_value: '0' }
  - { id: sys_tab, type: int, initial_value: '0' }   # SYS 面板分頁:0=SYSTEM 1=ATC CONF
  - id: poll_when_off
    type: bool
    restore_value: true
    initial_value: 'false'    # 背光關閉時仍持續抓取(設定頁勾選)
  - id: data_src
    type: int
    restore_value: true
    initial_value: '4'        # 0=OpenSky 1=A.LIVE 2=ADSB.LOL 3=ADSB.FI 4=MERGE
  # ATC 圖層開關(右下面板設定,各自存 NVS)
  - { id: atc_asp_on, type: bool, restore_value: true, initial_value: 'true' }   # 空域邊界
  - { id: atc_rwy_on, type: bool, restore_value: true, initial_value: 'true' }   # 跑道+延伸線
  - { id: atc_apt_on, type: bool, restore_value: true, initial_value: 'true' }   # 機場
  - { id: atc_fix_on, type: bool, restore_value: true, initial_value: 'true' }   # 導航點
  - { id: atc_route_on, type: bool, restore_value: true, initial_value: 'false' }  # 標籤起訖站行(逐架查 adsbdb)
  - { id: tz_sel, type: int, restore_value: true, initial_value: '0' }             # 時區下拉選擇(index，對齊 tz_posix)
  # 夜間模式(背光無 PWM 的板子用):100=不暗化 5=最暗;night_ov 為 LVGL top layer 遮罩
  - { id: night_level, type: int, restore_value: true, initial_value: '100' }
  - { id: night_ov, type: 'lv_obj_t *', initial_value: 'nullptr' }
  - { id: units_imperial, type: bool, restore_value: true, initial_value: 'false' } # 顯示單位:false=公制(°C/km/h/km/m)，true=英制(°F/mph/mi/ft)
  # ATC 模式:方塊+向量線+軌跡尾跡+STCA 衝突告警用的狀態
  - { id: trail_lat, type: 'std::vector<float>' }   # 10 槽 x 3 筆歷史,索引 slot*3+k
  - { id: trail_lon, type: 'std::vector<float>' }
  - { id: trail_cs,  type: 'std::vector<std::string>' }   # 各軌跡槽目前記錄的呼號(換機時作廢舊歷史)
  - { id: conflict_slot, type: 'std::vector<uint8_t>' }   # 各槽是否觸發 STCA 衝突告警
  - { id: lbl_side, type: 'std::vector<uint8_t>' }        # 各槽標籤位置 0=右 1=左(避開向量線)
  - { id: al0, type: uint32_t, restore_value: true, initial_value: '0' }
  - { id: al1, type: uint32_t, restore_value: true, initial_value: '0' }
  - { id: al2, type: uint32_t, restore_value: true, initial_value: '0' }
  - { id: al3, type: uint32_t, restore_value: true, initial_value: '0' }
  - { id: al_edit, type: int, initial_value: '0' }   # 目前編輯中的鬧鐘 index
  - { id: alarm_ringing, type: bool, initial_value: 'false' }
  - { id: snooze_at, type: uint32_t, initial_value: '0' }   # >0=貪睡中,到期 epoch 秒
  - { id: ring_last_ms, type: uint32_t, initial_value: '0' }   # 上次向喇叭發聲的 millis
  - { id: wake_ms,   type: uint32_t, initial_value: '0' }
  - { id: kb_target, type: int,      initial_value: '0' }   # 0=lat 1=lon 2=rng 3=poll
  - { id: wx_last_ms, type: uint32_t, initial_value: '0' }  # 上次抓天氣的 millis,0=立即抓
  - { id: maps_key, type: std::string }                     # 上次**成功**下載的「座標,層級」;相同就不重抓
  - { id: maps_key_try, type: std::string }                 # 進行中那次的 key,成功才寫進 maps_key
  - { id: maps_try_ms, type: uint32_t, initial_value: '0' } # 上次嘗試的 millis(失敗後 5 分鐘再試)
  - { id: spk_ids, type: 'std::vector<std::string>' }       # SCAN 到的喇叭 entity id(與下拉選單同序)
  - { id: ring_spk, type: std::string }                      # 響鈴中鬧鐘解析出的喇叭(貪睡重響沿用)

script:
  - id: fetch_flights            # 丟給 core 1 背景 task,UI 不阻塞
    mode: single
    then:
      - lambda: |-
          radar_bg::request_states(id(opensky_client_id).state,
                                   id(opensky_client_secret).state,
                                   id(home_lat).state, id(home_lon).state,
                                   id(radar_range).state, id(data_src));

  - id: select_slot
    parameters:
      slot: int
    then:
      - lambda: |-
          // 點選改「觸點最近航跡」:大號 mark(含呼號)熱區常蓋住鄰機,只信 slot 會選錯;
          // 圖示錨點也曾因未縮放 28px PNG 而視覺偏上偏左。這裡用觸點在裁剪層內座標,
          // 對所有圈內航機算到圖示中心的距離,取最近者(上限 ~RS(48))。
          float lat0 = id(home_lat).state, lon0 = id(home_lon).state;
          float rng = id(radar_range).state;
          float coslat = cosf(lat0 * 3.14159265f / 180.0f);
          float dt = (id(fetch_ms) > 0) ? (millis() - id(fetch_ms)) / 1000.0f : 0.0f;
          if (dt > 180.0f) dt = 180.0f;
          lv_point_t pt{0, 0};
          lv_indev_t *indev = lv_indev_active();
          if (indev) lv_indev_get_point(indev, &pt);
          const int tx = (int) pt.x - RS(12);
          const int ty = (int) pt.y - RS(12);
          const int max_d2 = RS(48) * RS(48);
          int best_i = -1, best_d2 = max_d2 + 1;
          const int n = (int) id(ac_lat).size();
          for (int i = 0; i < n; i++) {
            float rad = id(ac_trk)[i] * 3.14159265f / 180.0f;
            float vkm = id(ac_vel)[i] * dt / 1000.0f;
            float e  = (id(ac_lon)[i] - lon0) * 111.320f * coslat + vkm * sinf(rad);
            float no = (id(ac_lat)[i] - lat0) * 110.574f          + vkm * cosf(rad);
            if (e * e + no * no > rng * rng) continue;
            int px = RADAR_CX + (int) (e / rng * (float) RADAR_R);
            int py = RADAR_CX - (int) (no / rng * (float) RADAR_R);
            int dx = px - tx, dy = py - ty;
            int d2 = dx * dx + dy * dy;
            if (d2 < best_d2) { best_d2 = d2; best_i = i; }
          }
          int i = best_i;
          if (i < 0) {
            // 觸點離所有機都太遠:退回被點到的 slot(例如點呼號遠端)
            if (slot < 0 || slot >= (int) id(slot_map).size()) return;
            i = id(slot_map)[slot];
            if (i < 0 || i >= (int) id(ac_cs).size()) return;
          }
          id(spec_on) = false;   // 換機/取消選取都回到航班資訊(規格是上一台的)
          if (id(info_on)) {   // 點選飛機 → 退出系統資訊顯示
            id(info_on) = false;
            lv_obj_clear_state((lv_obj_t *) id(info_btn), LV_STATE_CHECKED);
            lv_obj_set_style_text_color(id(info_btn_l), lv_color_hex(0x00C060), 0);
          }
          if (!id(sel_cs_g).empty() && id(ac_cs)[i] == id(sel_cs_g)) {
            // 再點一次同一台 → 取消選取,右下角換回天氣
            id(sel_cs_g).clear();
            id(sel_hex_g) = 0;
            id(sel_hold_ms) = 0;
            id(show_weather).execute();
            return;
          }
          id(sel_cs_g) = id(ac_cs)[i];
          id(sel_hex_g) = (i < (int) id(ac_hex).size()) ? id(ac_hex)[i] : 0;
          id(sel_hold_ms) = millis();
          lv_label_set_text(id(sel_cs_l), id(ac_cs)[i].c_str());
          lv_label_set_text(id(sel_route_l), "ROUTE ...");
          float e = (id(ac_lon)[i] - lon0) * 111.320f * coslat;
          float no = (id(ac_lat)[i] - lat0) * 110.574f;
          float brg = atan2f(e, no) * 57.29578f;
          if (brg < 0) brg += 360.0f;
          char b[48];
          snprintf(b, sizeof(b), id(units_imperial) ? "ALT %5.0f ft    FL%03.0f" : "ALT %5.0f m     FL%03.0f",
                   id(ac_alt)[i] * (id(units_imperial) ? 3.2808f : 1.0f), id(ac_alt)[i] * 0.032808f);
          lv_label_set_text(id(sel_l1), b);
          snprintf(b, sizeof(b), id(units_imperial) ? "SPD %5.0f mph   %03.0f kt" : "SPD %5.0f km/h  %03.0f kt",
                   id(ac_vel)[i] * (id(units_imperial) ? 2.2369f : 3.6f), id(ac_vel)[i] * 1.9438f);
          lv_label_set_text(id(sel_l2), b);
          snprintf(b, sizeof(b), id(units_imperial) ? "VS  %+5.0f fpm   TRK %03.0f"
                                                    : "VS   %+02.1f m/s   TRK %03.0f",
                   id(ac_vr)[i] * (id(units_imperial) ? 196.85f : 1.0f), id(ac_trk)[i]);
          lv_label_set_text(id(sel_l3), b);
          snprintf(b, sizeof(b), id(units_imperial) ? "DIST %4.0f mi    BRG %03.0f" : "DIST %4.0f km    BRG %03.0f",
                   sqrtf(e * e + no * no) * (id(units_imperial) ? 0.6214f : 1.0f), brg);
          lv_label_set_text(id(sel_l4), b);
          radar_sq_line(id(sel_l5),
              i < (int) id(ac_sq).size() ? id(ac_sq)[i].c_str() : "");
          // OpenSky 不給機型:選中這一架就用 ICAO24 向 adsbdb 補查(背景+快取)
          if (i < (int) id(ac_ty).size())
            radar_bg::type_fill(id(ac_ty)[i], id(ac_reg)[i], id(ac_desc)[i], id(ac_hex)[i]);
          radar_type_badge(id(sel_type_l),
              i < (int) id(ac_ty).size() ? id(ac_ty)[i].c_str() : "");
      - script.execute: fetch_route
      - script.execute: atc_panel_sync   # 選機→藏圖層面板;取消選取→ATC 模式下重新顯示

  - id: toggle_spec            # 機型徽章當按鈕:輪廓+規格 ↔ 航班資訊
    mode: single
    then:
      - lambda: |-
          if (id(sel_cs_g).empty() || id(info_on)) return;
          id(spec_on) = !id(spec_on);
          if (id(spec_on)) {
            // 選取狀態存的是呼號不是索引(每輪重排),要現查
            int i = -1;
            for (size_t k = 0; k < id(ac_cs).size(); k++)
              if (id(ac_cs)[k] == id(sel_cs_g)) { i = (int) k; break; }
            if (i >= 0)
              radar_fill_spec(id(spec_img), id(spec_l0), id(spec_l1), id(spec_l2),
                              id(spec_l3), id(spec_l4), id(spec_l5), id(spec_l6),
                              id(spec_l7),
                              id(ac_ty)[i].c_str(), id(ac_reg)[i].c_str(),
                              id(ac_desc)[i].c_str(), id(ac_cat)[i].c_str(),
                              id(ac_hex)[i], id(ac_cs)[i].c_str(),
                              id(units_imperial));
            // 掃描動畫只在使用者按下徽章時放一次;面板每秒的重填不重放
            radar_sil_scan(id(spec_img), id(spec_scan_cover), id(spec_scan_line));
          }
      - script.execute: atc_panel_sync

  - id: show_sysinfo           # i 鈕開啟時,右下角面板顯示系統資訊(每秒刷新)
    mode: single
    then:
      - lambda: |-
          radar_show_sysinfo(id(sel_cs_l), id(sel_route_l), id(sel_l5), id(sel_l1),
                             id(sel_l2), id(sel_l3), id(sel_l4),
                             (int) wifi::global_wifi_component->wifi_rssi());
          // sel_l5(SQUAWK 列)由 radar_show_sysinfo 填入 MAP 狀態,不清空
          radar_type_badge(id(sel_type_l), "");   // 隱藏機型徽章(標題列改顯示面板名稱)

  - id: show_weather           # 無選取航班時,右下角面板顯示在地天氣(Open-Meteo)
    mode: single
    then:
      - lambda: |-
          if (id(info_on)) return;   // 系統資訊顯示中,不覆蓋
          lv_label_set_text(id(sel_cs_l), "LOCAL WX");
          lv_label_set_text(id(sel_route_l), "TAP AIRCRAFT TO TRACK");
          if (!radar_bg::g_wx_valid) {
            lv_label_set_text(id(sel_l1), "WAITING FOR DATA ...");
            lv_label_set_text(id(sel_l2), "");
            lv_label_set_text(id(sel_l3), "");
            lv_label_set_text(id(sel_l4), "");
            lv_label_set_text(id(sel_l5), "");
            radar_type_badge(id(sel_type_l), "");   // 隱藏機型徽章
            return;
          }
          static const char *PTS[16] = { "N","NNE","NE","ENE","E","ESE","SE","SSE",
                                         "S","SSW","SW","WSW","W","WNW","NW","NNW" };
          char b[48];
          snprintf(b, sizeof(b), id(units_imperial) ? "TEMP %6.1f F" : "TEMP %6.1f C",
                   id(units_imperial) ? radar_bg::g_wx.temp * 1.8f + 32.0f : radar_bg::g_wx.temp);
          lv_label_set_text(id(sel_l1), b);
          snprintf(b, sizeof(b), "HUM  %6.0f %%", radar_bg::g_wx.hum);
          lv_label_set_text(id(sel_l2), b);
          snprintf(b, sizeof(b), id(units_imperial) ? "WIND %6.1f mph" : "WIND %6.1f km/h",
                   radar_bg::g_wx.wspd * (id(units_imperial) ? 0.6214f : 1.0f));
          lv_label_set_text(id(sel_l3), b);
          float wd = radar_bg::g_wx.wdir;
          if (wd < 0) wd = 0;
          int pi = ((int) ((wd + 11.25f) / 22.5f)) % 16;
          snprintf(b, sizeof(b), "DIR  %6.0f  %s", wd, PTS[pi]);
          lv_label_set_text(id(sel_l4), b);
          lv_label_set_text(id(sel_l5), "");   // 這面板只用 4 行,清掉航班的 SQUAWK
          radar_type_badge(id(sel_type_l), "");   // 也隱藏機型徽章(標題列改顯示面板名稱)

  - id: fetch_route            # adsbdb.com 查起訖機場(背景執行)
    mode: single
    then:
      - lambda: 'radar_bg::request_route(id(sel_cs_g));'

  - id: take_screenshot        # 三指下滑:快照 framebuffer → :8081/screenshot.bmp,發 HA 事件觸發下載
    mode: single
    then:
      - lambda: |-
          if (screenshot_capture(id(main_display))) {
            char sb[64];
            if (g_shot_path[0])   // 有 TF 卡就顯示檔名,否則指向 HTTP
              snprintf(sb, sizeof(sb), "SCREENSHOT -> SD:%s", g_shot_path);
            else
              snprintf(sb, sizeof(sb), "SCREENSHOT -> :8081/screenshot.bmp");
            lv_label_set_text(id(status_label), sb);
          } else {
            lv_label_set_text(id(status_label), "SCREENSHOT FAILED");
          }
      - homeassistant.event:
          event: esphome.flight_radar_screenshot

  - id: atc_panel_sync         # 右下面板同步:ATC 圖層面板、SYS 分頁列、亮度滑桿
    mode: single
    then:
      - lambda: |-
          // 圖層設定只在 SYS 的 ATC CONF 分頁;閒置畫面一律天氣/航班(原始行為)
          bool tab_mode = id(info_on);
          bool show = tab_mode && id(sys_tab) == 1;
          if (show) lv_obj_clear_flag(id(atc_panel), LV_OBJ_FLAG_HIDDEN);
          else      lv_obj_add_flag(id(atc_panel), LV_OBJ_FLAG_HIDDEN);
          // 機型規格面板:只在「有選機、且不在系統資訊」時才可能出現,
          // 三個覆蓋層(atc_panel / sys_tabbar / spec_panel)一律在這裡決定,不各自為政
          bool spec = id(spec_on) && !tab_mode && !id(sel_cs_g).empty();
          if (!spec) id(spec_on) = false;
          if (spec) lv_obj_clear_flag(id(spec_panel), LV_OBJ_FLAG_HIDDEN);
          else      lv_obj_add_flag(id(spec_panel), LV_OBJ_FLAG_HIDDEN);
          // 徽章按下時反白,當作按鈕的按下狀態
          lv_obj_set_style_bg_color(id(sel_type_l), lv_color_hex(spec ? 0xFFEE00 : 0x00C060), 0);
          lv_obj_set_style_text_color(id(sel_type_l), lv_color_hex(spec ? 0x181400 : 0x04180C), 0);
          // 分頁列與分頁鈕高亮(amber 航管配色)
          if (tab_mode) {
            lv_obj_clear_flag(id(sys_tabbar), LV_OBJ_FLAG_HIDDEN);
            bool t1 = id(sys_tab) == 1;
            lv_obj_set_style_bg_color((lv_obj_t *) id(tab_sys_btn), lv_color_hex(t1 ? 0x040C08 : 0xE8A020), 0);
            lv_obj_set_style_text_color(id(tab_sys_l), lv_color_hex(t1 ? 0xE8A020 : 0x201200), 0);
            lv_obj_set_style_bg_color((lv_obj_t *) id(tab_atc_btn), lv_color_hex(t1 ? 0xE8A020 : 0x040C08), 0);
            lv_obj_set_style_text_color(id(tab_atc_l), lv_color_hex(t1 ? 0x201200 : 0xE8A020), 0);
          } else {
            lv_obj_add_flag(id(sys_tabbar), LV_OBJ_FLAG_HIDDEN);
          }
      - if:
          condition:
            lambda: 'return id(info_on);'
          then:
            - lvgl.widget.show: bl_slider
            - lvgl.widget.show: brt_l
          else:
            - lvgl.widget.hide: bl_slider
            - lvgl.widget.hide: brt_l

  - id: echo_refresh           # 回波:背景查最新圖層資訊
    mode: single
    then:
      - lambda: |-
          radar_bg::request_echo(id(home_lat).state, id(home_lon).state,
                                 id(radar_range).state);

  - id: rebuild_base           # 底圖重建:快取的底色+輪廓 → 預混合回波 → 距離環/十字線
    mode: single
    then:
      - lambda: |-
          radar_rebuild_base((lv_obj_t *) id(base_canvas), id(home_lat).state,
                             id(home_lon).state, id(radar_range).state,
                             id(map_on), id(echo_on),
                             atc_layer_mask(id(atc_on), id(atc_asp_on), id(atc_rwy_on), id(atc_apt_on), id(atc_fix_on)));

  - id: start_alarm            # 開始響鈴:亮背光、顯示面板、發聲
    mode: single
    then:
      - lambda: |-
          id(alarm_ringing) = true;
          if (!id(backlight).current_values.is_on()) {
            auto c = id(backlight).turn_on(); c.perform();
          }
          lv_obj_clear_flag((lv_obj_t *) id(alarm_overlay), LV_OBJ_FLAG_HIDDEN);
      - lambda: 'id(ring_last_ms) = millis();'
      - lvgl.page.show: main_page
      - script.execute: fire_alarm

  - id: stop_alarm             # 關閉鬧鐘:停聲、收面板、清貪睡
    mode: single
    then:
      - lambda: |-
          id(alarm_ringing) = false;
          id(snooze_at) = 0;
          lv_obj_add_flag((lv_obj_t *) id(alarm_overlay), LV_OBJ_FLAG_HIDDEN);
      - script.execute: hush_alarm

  - id: snooze_alarm           # 貪睡:停聲、收面板、9 分鐘後再響
    mode: single
    then:
      - lambda: |-
          id(alarm_ringing) = false;
          auto t = id(rtc_time).now();
          if (t.is_valid()) id(snooze_at) = (uint32_t) t.timestamp + 540;   // 9 分鐘
          lv_obj_add_flag((lv_obj_t *) id(alarm_overlay), LV_OBJ_FLAG_HIDDEN);
      - script.execute: hush_alarm

  # 發聲/停聲都看目標是不是板載喇叭:是 → 走 board 套件的 local_ring_*(rtttl),
  # 否則 → 走 HA 的 media_player(需在 HA 裝置頁允許執行動作)。
  - id: fire_alarm             # 觸發響鈴
    mode: single
    then:
      - if:
          condition:
            lambda: 'return alarmpk::is_local_spk(id(ring_spk).empty() ? id(alarm_speaker).state : id(ring_spk));'
          then:
            - script.execute: local_ring_start
          else:
            - homeassistant.action:
                action: media_player.play_media
                data:
                  entity_id: !lambda 'return id(ring_spk).empty() ? id(alarm_speaker).state : id(ring_spk);'
                  media_content_id: !lambda 'return id(alarm_media).state;'
                  media_content_type: music

  - id: hush_alarm             # 停止響鈴(DISMISS/SNOOZE 共用)
    mode: single
    then:
      - if:
          condition:
            lambda: 'return alarmpk::is_local_spk(id(ring_spk).empty() ? id(alarm_speaker).state : id(ring_spk));'
          then:
            - script.execute: local_ring_stop
          else:
            - homeassistant.action:
                action: media_player.media_stop
                data:
                  entity_id: !lambda 'return id(ring_spk).empty() ? id(alarm_speaker).state : id(ring_spk);'

  - id: alarm_refresh          # 依 globals 重繪鬧鐘頁所有欄位
    mode: single
    then:
      - lambda: |-
          uint32_t A[4] = { id(al0), id(al1), id(al2), id(al3) };
          lv_obj_t *en[4]  = { id(a0_en), id(a1_en), id(a2_en), id(a3_en) };
          lv_obj_t *enl[4] = { id(a0_enl), id(a1_enl), id(a2_enl), id(a3_enl) };
          lv_obj_t *tl[4]  = { id(a0_tl), id(a1_tl), id(a2_tl), id(a3_tl) };
          lv_obj_t *wd[4][7] = {
            { id(a0d0),id(a0d1),id(a0d2),id(a0d3),id(a0d4),id(a0d5),id(a0d6) },
            { id(a1d0),id(a1d1),id(a1d2),id(a1d3),id(a1d4),id(a1d5),id(a1d6) },
            { id(a2d0),id(a2d1),id(a2d2),id(a2d3),id(a2d4),id(a2d5),id(a2d6) },
            { id(a3d0),id(a3d1),id(a3d2),id(a3d3),id(a3d4),id(a3d5),id(a3d6) } };
          for (int i = 0; i < 4; i++) {
            bool e = alarmpk::en(A[i]);
            if (e) lv_obj_add_state(en[i], LV_STATE_CHECKED);
            else   lv_obj_clear_state(en[i], LV_STATE_CHECKED);
            lv_label_set_text(enl[i], e ? "ON" : "OFF");
            lv_obj_set_style_text_color(enl[i], lv_color_hex(e ? 0x04180C : 0x6E8273), 0);
            char b[8];
            snprintf(b, sizeof(b), "%02d:%02d", alarmpk::hh(A[i]), alarmpk::mm(A[i]));
            lv_label_set_text(tl[i], b);
            for (int k = 0; k < 7; k++) {
              bool on = alarmpk::day_on(A[i], k);
              if (on) lv_obj_add_state(wd[i][k], LV_STATE_CHECKED);
              else    lv_obj_clear_state(wd[i][k], LV_STATE_CHECKED);
            }
          }

  - id: spk_dd_refresh         # 各喇叭下拉選單顯示其目標(鬧鐘 1-4 專屬/預設)目前指派的喇叭
    mode: single
    then:
      - lambda: |-
          // 注意:dropdown 的 id() 是 LvDropdownType*(compound),不可硬轉 lv_obj_t*
          LvDropdownType *dd[5] = { id(a0_dd), id(a1_dd), id(a2_dd), id(a3_dd), id(spk_dd) };
          esphome::text::Text *t[5] = { id(al_spk0), id(al_spk1), id(al_spk2),
                                        id(al_spk3), id(alarm_speaker) };
          for (int k = 0; k < 5; k++) {
            std::string cur = t[k]->state;
            for (size_t j = 0; j < id(spk_ids).size(); j++)
              if (id(spk_ids)[j] == cur) {
                dd[k]->set_selected_index(j, LV_ANIM_OFF);
                break;
              }
          }

  - id: spk_scan               # 掃描 HA 的 media_player 清單 → 背景抓,結果填入 5 個下拉選單
    mode: single
    then:
      - lambda: |-
          LvDropdownType *dd[5] = { id(a0_dd), id(a1_dd), id(a2_dd), id(a3_dd), id(spk_dd) };
          // 板載喇叭永遠排第一,不依賴 HA:沒填 token 也選得到(見 alarm.h)
          id(spk_ids).clear();
          std::vector<std::string> names;
          #if RADAR_LOCAL_SPK
          id(spk_ids).push_back(alarmpk::LOCAL_SPK_ID);
          names.push_back(alarmpk::LOCAL_SPK_NAME);
          #endif
          if (id(ha_token).state.empty()) {
            names.push_back("SET HA TOKEN FIRST");   // 只是提示,選它不會寫入實體
            for (auto *d : dd) d->set_options(names);
            id(spk_dd_refresh).execute();
            return;
          }
          std::string url = id(ha_url).state;
          if (url.empty()) url = "http://homeassistant.local:8123";
          names.push_back("SCANNING ...");
          for (auto *d : dd) d->set_options(names);
          radar_bg::request_speakers(url, id(ha_token).state);

  - id: tp_open                # 開啟時間選擇覆蓋層,捲輪定位到 al_edit 那組的時分
    mode: single
    then:
      - lambda: |-
          uint32_t A[4] = { id(al0), id(al1), id(al2), id(al3) };
          int i = id(al_edit);
          char b[12];
          snprintf(b, sizeof(b), "ALARM %d", i + 1);
          lv_label_set_text(id(tp_title), b);
          // 注意:roller 的 id() 是 LvRollerType*(compound),不可硬轉 lv_obj_t*
          id(tp_hr)->set_selected_index(alarmpk::hh(A[i]), LV_ANIM_OFF);
          id(tp_mr)->set_selected_index(alarmpk::mm(A[i]), LV_ANIM_OFF);
          lv_obj_clear_flag((lv_obj_t *) id(tp_overlay), LV_OBJ_FLAG_HIDDEN);

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

button:
  - platform: restart
    name: Restart

interval:
  # 抓取節拍器:每秒 +1,到達 Poll Interval 且條件允許就抓一次
  - interval: 1s
    then:
      - lambda: |-
          // i 鈕開啟中 → 每秒刷新系統資訊(RAM/PSRAM/運行時間會變)
          if (id(info_on)) id(show_sysinfo).execute();
          // 工具列每秒置頂一次:航班 mark 顯隱/set_pos 後偶發搶到上層,SYS 就點不到
          {
            static lv_obj_t *tb[] = {
              (lv_obj_t *) id(map_btn), (lv_obj_t *) id(echo_btn),
              (lv_obj_t *) id(persist_btn), (lv_obj_t *) id(atc_btn),
              (lv_obj_t *) id(pwr_btn), (lv_obj_t *) id(info_btn),
            };
            for (auto *b : tb) {
              if (!b) continue;
              lv_obj_move_foreground(b);
            }
          }
          // 響鈴中 → 每 15 秒重播一次,直到使用者按 DISMISS
          if (id(alarm_ringing) && (millis() - id(ring_last_ms)) >= 15000) {
            id(ring_last_ms) = millis();
            id(fire_alarm).execute();
          }
          // 貪睡到期 → 重新響
          if (id(snooze_at) > 0 && !id(alarm_ringing)) {
            auto t = id(rtc_time).now();
            if (t.is_valid() && (uint32_t) t.timestamp >= id(snooze_at)) {
              id(snooze_at) = 0;
              id(start_alarm).execute();
            }
          }
          id(poll_tick) += 1;
          bool creds = !id(opensky_client_id).state.empty() &&
                       !id(opensky_client_secret).state.empty();
          if (id(data_src) == 0 && !creds) {   // 免費來源不需憑證,擋門只對 OpenSky
            lv_label_set_text(id(status_label), "SET OPENSKY CREDENTIALS");
            return;
          }
          // OpenSky 失敗冷卻中(bg task 走免費來源)→ 節奏也切到免費來源的間隔
          bool cooling = (millis() / 1000) < radar_bg::g_os_cooldown_until;
          int itv = (id(data_src) != 0 || cooling) ? (int) id(poll_interval_alt).state
                                                   : (int) id(poll_interval).state;
          if (id(poll_tick) >= itv) {
            if (wifi::global_wifi_component->is_connected() &&
                (id(backlight).current_values.is_on() || id(poll_when_off))) {   // 背光關=暫停抓取(可設定例外)
              id(poll_tick) = 0;
              id(fetch_flights).execute();
            }
          }
      # 收背景 task 的結果(非阻塞)
      - lambda: |-
          if (radar_bg::g_auth_fail) {
            radar_bg::g_auth_fail = false;
            lv_label_set_text(id(status_label), "OPENSKY AUTH FAIL - USING FALLBACK");
          }
          static bool echo_init = false;
          if (!echo_init && id(echo_on) && millis() > 8000 &&
              wifi::global_wifi_component->is_connected()) {
            echo_init = true;
            id(echo_refresh).execute();
          }
          if (radar_bg::g_echo_ready) {
            xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
            radar_bg::g_echo_ready = false;
            xSemaphoreGive(radar_bg::mtx());
            if (id(echo_on))
              id(rebuild_base).execute();   // 新幀預混合進底圖,一次算完
          }
          // ---- 地圖圖磚:需要時下載一次,完成後由主迴圈載入 ----
          // 觸發條件刻意保守,避免變成重試迴圈把流量燒掉(見 PLAN_MAPTILES.md):
          // 連上網之後,只有「目前沒有地圖」或「座標/半徑/層級與存檔不同」才抓。
          // maps_key 記下上次**成功**的參數;失敗才對「同一組 key」做 5 分鐘節流。
          // 注意:不能對「換了座標」也套 5 分鐘 —— 否則剛在 A 地下完、改到 B 地
          // 會繼續畫 A 的輪廓(圈外全空),看起來像地圖壞了。
          if (millis() > 10000 && wifi::global_wifi_component->is_connected() &&
              !radar_bg::g_maps_busy) {
            const int lv = radar_bg::maps_level_for(id(radar_range).state);
            // 0.5 度約 55 km:小幅移動不必重抓,格子是 10 度寬,綽綽有餘。
            char key[64];
            // 把 CDN 指紋編進 key:換成自建 Pages 後必須重抓,不能沿用舊分割區內容。
            uint32_t cdn_h = 2166136261u;
            for (const char *p = radar_bg::MAPS_BASE; *p; ++p)
              cdn_h = (cdn_h ^ (uint8_t) *p) * 16777619u;
            snprintf(key, sizeof(key), "%.1f,%.1f,L%d,%08lx,s7",
                     id(home_lat).state, id(home_lon).state, lv,
                     (unsigned long) cdn_h);
            const bool key_changed = (id(maps_key) != key);
            const bool retrying_same = (id(maps_key_try) == key);
            const bool throttle_ok =
                !retrying_same || id(maps_try_ms) == 0 ||
                (millis() - id(maps_try_ms) > 300000);
            if (key_changed && throttle_ok) {
              id(maps_try_ms) = millis();
              id(maps_key_try) = key;
              radar_bg::request_maps(id(home_lat).state, id(home_lon).state,
                                     id(radar_range).state);
            }
          }
          // 下載進度只更新旗標;真正寫入 status_label 在後面與 AC:n 同一處,
          // 避免被航班刷新立刻蓋掉(看起來像「完全沒進度」)。
          {
            static bool was_busy = false;
            const bool busy = radar_bg::g_maps_busy;
            if (was_busy && !busy) {
              if (id(info_on)) id(show_sysinfo).execute();
              else if (id(sel_cs_g).empty()) id(show_weather).execute();
            }
            was_busy = busy;
          }
          if (radar_bg::g_maps_ready) {
            xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
            radar_bg::g_maps_ready = false;
            xSemaphoreGive(radar_bg::mtx());
            id(maps_key) = id(maps_key_try);   // 只有成功才算數
            id(maps_try_ms) = 0;               // 成功後允許立刻因換座標再抓
            // 載入在主迴圈做,不在背景 task —— 繪製程式碼直接讀 maptiles 的
            // vector,在 task 裡改會與繪製打架。
            maptiles::load_from_partition();
            id(rebuild_base).execute();   // generation 已變,快取自然失效
          }
          if (radar_bg::g_route_ready) {
            xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
            radar_bg::g_route_ready = false;
            if (!id(info_on))
              lv_label_set_text(id(sel_route_l), radar_bg::g_route.c_str());
            xSemaphoreGive(radar_bg::mtx());
          }
          // 在地天氣:開機 8 秒後首抓,之後每 10 分鐘;座標變更時 wx_last_ms 歸零強制重抓
          if (millis() > 8000 && wifi::global_wifi_component->is_connected() &&
              (id(wx_last_ms) == 0 || millis() - id(wx_last_ms) > 600000)) {
            id(wx_last_ms) = millis();
            radar_bg::request_weather(id(home_lat).state, id(home_lon).state);
          }
          if (radar_bg::g_wx_ready) {
            xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
            radar_bg::g_wx_ready = false;
            xSemaphoreGive(radar_bg::mtx());
            if (id(sel_cs_g).empty())
              id(show_weather).execute();
          }
          // 喇叭掃描結果 → 填入鬧鐘頁 5 個下拉選單(1-4 專屬 + DEF 預設)
          if (radar_bg::g_speakers_ready) {
            xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
            radar_bg::g_speakers_ready = false;
            std::string raw = radar_bg::g_speakers;
            int st2 = radar_bg::g_spk_status;
            xSemaphoreGive(radar_bg::mtx());
            // 注意:dropdown 的 id() 是 LvDropdownType*(compound),不可硬轉 lv_obj_t*
            LvDropdownType *dd[5] = { id(a0_dd), id(a1_dd), id(a2_dd), id(a3_dd), id(spk_dd) };
            id(spk_ids).clear();
            std::vector<std::string> names;
            #if RADAR_LOCAL_SPK
            id(spk_ids).push_back(alarmpk::LOCAL_SPK_ID);   // 板載喇叭固定在第一項
            names.push_back(alarmpk::LOCAL_SPK_NAME);
            #endif
            const size_t base_n = names.size();             // HA 之外已有幾項
            if (st2 == 401 || st2 == 403) {
              names.push_back("TOKEN INVALID");
            } else if (st2 != 200) {
              names.push_back("HA UNREACHABLE");
            } else {
              size_t pos = 0;
              while (pos < raw.size()) {
                size_t nl = raw.find('\n', pos);
                if (nl == std::string::npos) nl = raw.size();
                std::string line = raw.substr(pos, nl - pos);
                pos = nl + 1;
                if (!line.empty() && line.back() == '\r') line.pop_back();
                size_t bar = line.find('|');
                if (bar == std::string::npos || bar == 0) continue;
                id(spk_ids).push_back(line.substr(0, bar));
                names.push_back(line.substr(bar + 1));
              }
              if (names.size() == base_n) names.push_back("NO SPEAKERS FOUND");
            }
            for (auto *d : dd) d->set_options(names);
            id(spk_dd_refresh).execute();   // 各選單同步顯示目前指派的喇叭
          }
          if (!radar_bg::g_states_ready) return;
          xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
          int n = radar_bg::g_result.size();
          // ATC 軌跡尾跡:資料被覆寫前,依呼號比對舊位置,推入 trail 歷史(0=最新,2=最舊)
          if (id(trail_lat).size() != AC_SLOTS * 3) id(trail_lat).assign(AC_SLOTS * 3, NAN);
          if (id(trail_lon).size() != AC_SLOTS * 3) id(trail_lon).assign(AC_SLOTS * 3, NAN);
          if (id(trail_cs).size() != AC_SLOTS) id(trail_cs).assign(AC_SLOTS, "");
          {
            int lim = n < AC_SLOTS ? n : AC_SLOTS;
            for (int j = 0; j < lim; j++) {
              const std::string &cs = radar_bg::g_result[j].cs;
              int base = j * 3;
              if (id(trail_cs)[j] != cs) {   // 這格換機了:舊歷史屬於前任,全部作廢
                id(trail_cs)[j] = cs;
                for (int k = 0; k < 3; k++) { id(trail_lat)[base + k] = NAN; id(trail_lon)[base + k] = NAN; }
              }
              int oi = -1;
              for (int k = 0; k < (int) id(ac_cs).size(); k++)
                if (id(ac_cs)[k] == cs) { oi = k; break; }
              if (oi < 0) continue;   // 新出現的機,還沒有歷史
              id(trail_lat)[base + 2] = id(trail_lat)[base + 1];
              id(trail_lon)[base + 2] = id(trail_lon)[base + 1];
              id(trail_lat)[base + 1] = id(trail_lat)[base];
              id(trail_lon)[base + 1] = id(trail_lon)[base];
              id(trail_lat)[base] = id(ac_lat)[oi];
              id(trail_lon)[base] = id(ac_lon)[oi];
            }
          }
          id(ac_lat).clear(); id(ac_lon).clear(); id(ac_trk).clear();
          id(ac_vel).clear(); id(ac_alt).clear(); id(ac_cs).clear(); id(ac_vr).clear();
          id(ac_lc).clear(); id(ac_sq).clear(); id(ac_ty).clear();
          id(ac_reg).clear(); id(ac_desc).clear(); id(ac_cat).clear(); id(ac_hex).clear();
          for (auto &ac : radar_bg::g_result) {
            id(ac_reg).push_back(ac.reg); id(ac_desc).push_back(ac.desc);
            id(ac_cat).push_back(ac.cat); id(ac_hex).push_back(ac.hex);
            id(ac_lat).push_back(ac.lat); id(ac_lon).push_back(ac.lon);
            id(ac_trk).push_back(ac.trk); id(ac_vel).push_back(ac.vel);
            id(ac_alt).push_back(ac.alt); id(ac_cs).push_back(ac.cs);
            id(ac_vr).push_back(ac.vr); id(ac_lc).push_back(ac.lc);
            id(ac_sq).push_back(ac.sq); id(ac_ty).push_back(ac.ty);
          }
          radar_bg::g_states_ready = false;
          xSemaphoreGive(radar_bg::mtx());
          id(fetch_ms) = millis();
          // 選取中航班的詳情刷新(系統資訊顯示中則不覆蓋)
          if (!id(sel_cs_g).empty() && !id(info_on)) {
            int si = -1;
            const int nn = (int) id(ac_cs).size();
            for (int i = 0; i < nn; i++) {
              if (id(ac_cs)[i] == id(sel_cs_g)) { si = i; break; }
              if (id(sel_hex_g) != 0 && i < (int) id(ac_hex).size() &&
                  id(ac_hex)[i] == id(sel_hex_g)) {
                si = i;
                id(sel_cs_g) = id(ac_cs)[i];  // 呼號若變了(合併源差異)跟著更新
                break;
              }
            }
            char b2[48];
            if (si >= 0) {
              id(sel_hold_ms) = millis();
              if (si < (int) id(ac_hex).size()) id(sel_hex_g) = id(ac_hex)[si];
              float lat0 = id(home_lat).state, lon0 = id(home_lon).state;
              float coslat = cosf(lat0 * 3.14159265f / 180.0f);
              float e2 = (id(ac_lon)[si] - lon0) * 111.320f * coslat;
              float n2 = (id(ac_lat)[si] - lat0) * 110.574f;
              float brg = atan2f(e2, n2) * 57.29578f;
              if (brg < 0) brg += 360.0f;
