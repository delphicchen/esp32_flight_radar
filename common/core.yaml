            bool slot_ch = (last_map[shown] != i);
            last_map[shown] = i;
            // 圖示中心 = (mx+ix+14, my+iy+14) → 對準航跡 (px,py)
            int mx = px - (ix + 14);
            int my = py - (iy + 14);
            if (slot_ch || abs(mx - last_px[shown]) > 1 || abs(my - last_py[shown]) > 1) {
              lv_obj_set_pos(marks[shown], mx, my);
              last_px[shown] = (int16_t) mx;
              last_py[shown] = (int16_t) my;
            }
            // 航向量化到 5°,避免每秒因外插微抖重繪旋轉圖
            int16_t ang10 = ((int16_t) (id(ac_trk)[i] * 10.0f)) % 3600;
            if (ang10 < 0) ang10 += 3600;
            ang10 = (int16_t) ((ang10 / 50) * 50);
            if (slot_ch || ang10 != last_ang[shown]) {
              lv_img_set_angle(imgs[shown], ang10);
              last_ang[shown] = ang10;
            }
            // 選取高亮:呼號變黃(0xFFD24A)。餘暉迴圈會再疊掃描亮度,但選取變化
            // 必須立刻寫色——以前包在 !persist_on 裡,FADE 開時點選完全不變色。
            uint8_t sg = selg ? 1 : 0;
            if (slot_ch || last_sel[shown] != sg) {
              last_sel[shown] = sg;
              lv_obj_set_style_img_recolor(imgs[shown], lv_color_hex(selg ? 0xFFD24A : 0x40FF9A), 0);
              lv_obj_set_style_img_recolor_opa(imgs[shown], LV_OPA_COVER, 0);
              if (!id(persist_on))
                lv_obj_set_style_opa(marks[shown], LV_OPA_COVER, 0);
            }
            earr[shown] = e; noarr[shown] = no; selarr[shown] = selg;
            // 訊號延遲:last_contact 超過 60 秒沒更新
            bool stale = false;
            if (id(rtc_time).now().is_valid()) {
              uint32_t now_epoch = (uint32_t) id(rtc_time).now().timestamp;
              uint32_t lc = (i < (int) id(ac_lc).size()) ? id(ac_lc)[i] : now_epoch;
              stale = (now_epoch > lc) && (now_epoch - lc > 60);
            }
            if (atc) {
              lv_obj_add_flag(imgs[shown], LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(sqs[shown], LV_OBJ_FLAG_HIDDEN);
              uint32_t basecol = selg ? 0xFFFFFF : (stale ? 0xFFCC00 : 0x00FF41);
              lv_obj_set_style_bg_color(sqs[shown], lv_color_hex(basecol), 0);
              lv_obj_set_style_text_color(dbs[shown], lv_color_hex(basecol), 0);
              // 速度向量線:未來 120 秒推算位置,超出雷達圈就沿方向 clamp 回圓周上
              float vkm2 = id(ac_vel)[i] * 120.0f / 1000.0f;
              float e2 = e + vkm2 * sinf(rad);
              float n2 = no + vkm2 * cosf(rad);
              float d2 = sqrtf(e2 * e2 + n2 * n2);
              if (d2 > rng) { e2 *= rng / d2; n2 *= rng / d2; }
              int px2 = RADAR_CX + (int) (e2 / rng * (float) RADAR_R);
              int py2 = RADAR_CX - (int) (n2 / rng * (float) RADAR_R);
              static lv_point_precise_t vp[AC_SLOTS][2];   // LVGL 9 的 line 點座標型別
              vp[shown][0].x = px;  vp[shown][0].y = py;
              vp[shown][1].x = px2; vp[shown][1].y = py2;
              lv_line_set_points(vecs[shown], vp[shown], 2);
              // 向量/尾跡可見性與 mark 一致,見下方 gshow 閘門(餘暉未掃過不顯示)
              // 歷史軌跡:只在新抓取時重算(外插秒級移動不必每秒重佈 6 點)
              if (upd_trail || slot_ch) {
                int lx = px, ly = py, k = 0, d = 0;
                for (; k < 3; k++) {
                  float tlat = (i < AC_SLOTS) ? id(trail_lat)[i * 3 + k] : NAN;
                  float tlon = (i < AC_SLOTS) ? id(trail_lon)[i * 3 + k] : NAN;
                  if (isnan(tlat) || isnan(tlon)) break;
                  float te = (tlon - lon0) * 111.320f * coslat;
                  float tn = (tlat - lat0) * 110.574f;
                  if (te * te + tn * tn > rng * rng) break;
                  int tx = RADAR_CX + (int) (te / rng * (float) RADAR_R);
                  int ty = RADAR_CX - (int) (tn / rng * (float) RADAR_R);
                  lv_obj_set_pos(trs[shown][d], (lx + tx) / 2 - 1, (ly + ty) / 2 - 1);
                  lv_obj_clear_flag(trs[shown][d], LV_OBJ_FLAG_HIDDEN);
                  d++;
                  lv_obj_set_pos(trs[shown][d], tx - 1, ty - 1);
                  lv_obj_clear_flag(trs[shown][d], LV_OBJ_FLAG_HIDDEN);
                  d++;
                  lx = tx; ly = ty;
                }
                for (; d < 6; d++) lv_obj_add_flag(trs[shown][d], LV_OBJ_FLAG_HIDDEN);
              }
            } else {
              lv_obj_clear_flag(imgs[shown], LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(sqs[shown], LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(vecs[shown], LV_OBJ_FLAG_HIDDEN);
              for (int k = 0; k < 6; k++) lv_obj_add_flag(trs[shown][k], LV_OBJ_FLAG_HIDDEN);
              if (slot_ch)
                lv_obj_set_style_text_color(dbs[shown], lv_color_hex(0x9AE6B4), 0);
            }
            // 只顯示「選中」航班的呼號/高度標籤,其餘只留機標,避免更新時滿屏呼號
            uint8_t want_lbl = (uint8_t) (selg ? 1 : 0);
            if (last_lbl[shown] != want_lbl) {
              last_lbl[shown] = want_lbl;
              if (want_lbl) lv_obj_clear_flag(dbs[shown], LV_OBJ_FLAG_HIDDEN);
              else          lv_obj_add_flag(dbs[shown], LV_OBJ_FLAG_HIDDEN);
            }
            if (want_lbl) {
              char db[48];
              if (atc) {
                const char *arrow = (id(ac_vr)[i] > 0.5f) ? "↑" : (id(ac_vr)[i] < -0.5f ? "↓" : "=");
                snprintf(db, sizeof(db), "%s%s\nFL%03.0f%s%.0fkts", id(ac_cs)[i].c_str(),
                         stale ? "*" : "", id(ac_alt)[i] * 0.032808f, arrow, id(ac_vel)[i] * 1.9438f);
                if (id(atc_route_on)) {
                  std::string rt = radar_bg::route_cache_get(id(ac_cs)[i]);
                  if (!rt.empty() && rt != "-") {
                    size_t dl = strlen(db);
                    snprintf(db + dl, sizeof(db) - dl, "\n%s", rt.c_str());
                  }
                }
              } else {
                snprintf(db, sizeof(db), "%s\n%03.0f %.0f", id(ac_cs)[i].c_str(),
                         id(ac_alt)[i] * 0.032808f, id(ac_vel)[i] * 1.9438f);
              }
              if (strcmp(lv_label_get_text(dbs[shown]), db) != 0)
                lv_label_set_text(dbs[shown], db);
            }
            if (id(slot_angle).size() != AC_SLOTS) id(slot_angle).assign(AC_SLOTS, -1.0f);
            if (id(slot_glow).size() != AC_SLOTS) id(slot_glow).assign(AC_SLOTS, 0.0f);
            float bearing = atan2f(e, no) * 57.29578f;   // 0=北,順時針
            if (bearing < 0) bearing += 360.0f;
            id(slot_angle)[shown] = bearing;
            id(slot_map)[shown] = i;
            // 餘暉模式:尚未被掃描線掃過(glow≈0)的目標先藏起來;選取中例外以便點選後仍看得到
            // ATC 向量/尾跡與 mark 同步,避免「線先出現、機還沒被掃到」
            float gshow = id(slot_glow)[shown];
            bool visible = !id(persist_on) || gshow > 0.02f || selg;
            if (visible)
              lv_obj_clear_flag(marks[shown], LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(marks[shown], LV_OBJ_FLAG_HIDDEN);
            if (atc) {
              if (visible) {
                lv_obj_clear_flag(vecs[shown], LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_obj_add_flag(vecs[shown], LV_OBJ_FLAG_HIDDEN);
                for (int k = 0; k < 6; k++) lv_obj_add_flag(trs[shown][k], LV_OBJ_FLAG_HIDDEN);
              }
            }
            shown++;
          }
          if (upd_trail) last_trail_fetch = id(fetch_ms);
          id(ac_shown_n) = shown;
          // STCA:兩兩比對水平距離 < 5.5km 且高度差 < 300m → 衝突告警(紅色,選取中則紅白交替)
          if (id(conflict_slot).size() != AC_SLOTS) id(conflict_slot).assign(AC_SLOTS, 0);
          for (int a = 0; a < AC_SLOTS; a++) id(conflict_slot)[a] = 0;
          if (atc) {
            for (int a = 0; a < shown; a++) {
              int ia = id(slot_map)[a];
              for (int b = a + 1; b < shown; b++) {
                int ib = id(slot_map)[b];
                float dex = earr[a] - earr[b], dno = noarr[a] - noarr[b];
                float dist = sqrtf(dex * dex + dno * dno);
                float dalt = fabsf(id(ac_alt)[ia] - id(ac_alt)[ib]);
                if (dist < 5.5f && dalt < 300.0f) {
                  id(conflict_slot)[a] = 1;
                  id(conflict_slot)[b] = 1;
                }
              }
            }
            for (int a = 0; a < shown; a++) {
              if (!id(conflict_slot)[a]) continue;
              bool blink = (millis() / 1000) % 2 == 0;
              uint32_t col = (selarr[a] && !blink) ? 0xFFFFFF : 0xFF0033;
              lv_obj_set_style_bg_color(sqs[a], lv_color_hex(col), 0);
              lv_obj_set_style_text_color(dbs[a], lv_color_hex(col), 0);
            }
          }
          for (int i = shown; i < AC_SLOTS; i++) {
            lv_obj_add_flag(marks[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(vecs[i], LV_OBJ_FLAG_HIDDEN);
            for (int k = 0; k < 6; k++) lv_obj_add_flag(trs[i][k], LV_OBJ_FLAG_HIDDEN);
            id(slot_map)[i] = -1;
            if (id(slot_angle).size() == AC_SLOTS) id(slot_angle)[i] = -1.0f;
            last_map[i] = -2;
            last_lbl[i] = 0xFF;
            last_px[i] = -9999;
            last_sel[i] = 0xFF;
          }
  # 掃描線動畫:LVGL line 扇形尾巴 + 牆鐘角度(避免半圈快慢)
  # 接近遠程一次雷達:FADE 開約 2.5 RPM(24s/圈);關閉 5 RPM(12s/圈)。
  - interval: 16ms
    then:
      - lambda: |-
          const bool persist = id(persist_on);
          const float PERIOD = persist ? 24000.0f : 12000.0f;
          lv_obj_t *lines[5] = { id(sweep_line)->obj,
                                 id(tail0)->obj, id(tail1)->obj, id(tail2)->obj, id(tail3)->obj };
          id(sweep_angle) = radar_sweep_tick(
              PERIOD, id(backlight).current_values.is_on(), id(sweep_angle),
              id(main_page)->obj, (lv_obj_t *) id(base_canvas), lines);

  # 航班餘暉/高亮(與掃描線拆開):80ms + 每拍 LVGL 預算,避免拖垮掃描線
  - interval: 80ms
    then:
      - lambda: |-
          if (id(slot_glow).size() != AC_SLOTS) id(slot_glow).assign(AC_SLOTS, 0.0f);
          if (id(slot_angle).size() != AC_SLOTS) return;
          const bool persist = id(persist_on);
          const bool dark = !id(backlight).current_values.is_on();
          static float prev_ang = -1.0f;
          float cur = id(sweep_angle);
          float prev = (prev_ang < 0.0f) ? cur : prev_ang;
          prev_ang = cur;
          float dang = (cur >= prev) ? (cur - prev) : (360.0f - prev + cur);
          static lv_obj_t *marks[AC_SLOTS] = {};
          static lv_obj_t *imgs[AC_SLOTS] = {};
          static lv_obj_t *vecs[AC_SLOTS] = {};
          static bool ptrs_ok = false;
          if (!ptrs_ok) {
            marks[0]=id(ac0); marks[1]=id(ac1); marks[2]=id(ac2); marks[3]=id(ac3);
            marks[4]=id(ac4); marks[5]=id(ac5); marks[6]=id(ac6); marks[7]=id(ac7);
            marks[8]=id(ac8); marks[9]=id(ac9); marks[10]=id(ac10); marks[11]=id(ac11);
            marks[12]=id(ac12); marks[13]=id(ac13); marks[14]=id(ac14); marks[15]=id(ac15);
            marks[16]=id(ac16); marks[17]=id(ac17); marks[18]=id(ac18); marks[19]=id(ac19);
            marks[20]=id(ac20); marks[21]=id(ac21); marks[22]=id(ac22); marks[23]=id(ac23);
            marks[24]=id(ac24); marks[25]=id(ac25); marks[26]=id(ac26); marks[27]=id(ac27);
            marks[28]=id(ac28); marks[29]=id(ac29); marks[30]=id(ac30); marks[31]=id(ac31);
            marks[32]=id(ac32); marks[33]=id(ac33); marks[34]=id(ac34); marks[35]=id(ac35);
            marks[36]=id(ac36); marks[37]=id(ac37); marks[38]=id(ac38); marks[39]=id(ac39);
            imgs[0]=(lv_obj_t*)id(ai0); imgs[1]=(lv_obj_t*)id(ai1); imgs[2]=(lv_obj_t*)id(ai2); imgs[3]=(lv_obj_t*)id(ai3);
            imgs[4]=(lv_obj_t*)id(ai4); imgs[5]=(lv_obj_t*)id(ai5); imgs[6]=(lv_obj_t*)id(ai6); imgs[7]=(lv_obj_t*)id(ai7);
            imgs[8]=(lv_obj_t*)id(ai8); imgs[9]=(lv_obj_t*)id(ai9); imgs[10]=(lv_obj_t*)id(ai10); imgs[11]=(lv_obj_t*)id(ai11);
            imgs[12]=(lv_obj_t*)id(ai12); imgs[13]=(lv_obj_t*)id(ai13); imgs[14]=(lv_obj_t*)id(ai14); imgs[15]=(lv_obj_t*)id(ai15);
            imgs[16]=(lv_obj_t*)id(ai16); imgs[17]=(lv_obj_t*)id(ai17); imgs[18]=(lv_obj_t*)id(ai18); imgs[19]=(lv_obj_t*)id(ai19);
            imgs[20]=(lv_obj_t*)id(ai20); imgs[21]=(lv_obj_t*)id(ai21); imgs[22]=(lv_obj_t*)id(ai22); imgs[23]=(lv_obj_t*)id(ai23);
            imgs[24]=(lv_obj_t*)id(ai24); imgs[25]=(lv_obj_t*)id(ai25); imgs[26]=(lv_obj_t*)id(ai26); imgs[27]=(lv_obj_t*)id(ai27);
            imgs[28]=(lv_obj_t*)id(ai28); imgs[29]=(lv_obj_t*)id(ai29); imgs[30]=(lv_obj_t*)id(ai30); imgs[31]=(lv_obj_t*)id(ai31);
            imgs[32]=(lv_obj_t*)id(ai32); imgs[33]=(lv_obj_t*)id(ai33); imgs[34]=(lv_obj_t*)id(ai34); imgs[35]=(lv_obj_t*)id(ai35);
            imgs[36]=(lv_obj_t*)id(ai36); imgs[37]=(lv_obj_t*)id(ai37); imgs[38]=(lv_obj_t*)id(ai38); imgs[39]=(lv_obj_t*)id(ai39);
            vecs[0]=id(vec0)->obj; vecs[1]=id(vec1)->obj; vecs[2]=id(vec2)->obj; vecs[3]=id(vec3)->obj;
            vecs[4]=id(vec4)->obj; vecs[5]=id(vec5)->obj; vecs[6]=id(vec6)->obj; vecs[7]=id(vec7)->obj;
            vecs[8]=id(vec8)->obj; vecs[9]=id(vec9)->obj; vecs[10]=id(vec10)->obj; vecs[11]=id(vec11)->obj;
            vecs[12]=id(vec12)->obj; vecs[13]=id(vec13)->obj; vecs[14]=id(vec14)->obj; vecs[15]=id(vec15)->obj;
            vecs[16]=id(vec16)->obj; vecs[17]=id(vec17)->obj; vecs[18]=id(vec18)->obj; vecs[19]=id(vec19)->obj;
            vecs[20]=id(vec20)->obj; vecs[21]=id(vec21)->obj; vecs[22]=id(vec22)->obj; vecs[23]=id(vec23)->obj;
            vecs[24]=id(vec24)->obj; vecs[25]=id(vec25)->obj; vecs[26]=id(vec26)->obj; vecs[27]=id(vec27)->obj;
            vecs[28]=id(vec28)->obj; vecs[29]=id(vec29)->obj; vecs[30]=id(vec30)->obj; vecs[31]=id(vec31)->obj;
            vecs[32]=id(vec32)->obj; vecs[33]=id(vec33)->obj; vecs[34]=id(vec34)->obj; vecs[35]=id(vec35)->obj;
            vecs[36]=id(vec36)->obj; vecs[37]=id(vec37)->obj; vecs[38]=id(vec38)->obj; vecs[39]=id(vec39)->obj;
            ptrs_ok = true;
          }
          static uint8_t last_opa[AC_SLOTS];
          static uint8_t last_gq[AC_SLOTS];
          static uint8_t last_selg[AC_SLOTS];
          static bool last_opa_init = false;
          if (!last_opa_init) {
            for (int i = 0; i < AC_SLOTS; i++) {
              last_opa[i] = 255; last_gq[i] = 255; last_selg[i] = 0xFF;
            }
            last_opa_init = true;
          }
          // 每拍最多 N 次非「剛掃過」的樣式寫入,其餘只更新數值下拍補
          int budget = (id(ac_shown_n) > 20) ? 6 : 10;
          for (int i = 0; i < AC_SLOTS; i++) {
            float ang = id(slot_angle)[i];
            if (ang < 0) continue;
            bool crossed;
            if (cur >= prev) crossed = (ang > prev && ang <= cur);
            else             crossed = (ang > prev || ang <= cur);
            float g0 = id(slot_glow)[i];
            float g;
            if (!persist) {
              g = crossed ? 1.0f : g0 - dang / 30.0f;
              if (g < 0.0f) g = 0.0f;
            } else {
              g = crossed ? 1.0f : g0 - dang / 360.0f;
              if (g < 0.0f) g = 0.0f;
            }
            id(slot_glow)[i] = g;
            int idx = (i < (int) id(slot_map).size()) ? id(slot_map)[i] : -1;
            bool selg = (idx >= 0 && !id(sel_cs_g).empty() &&
                         idx < (int) id(ac_cs).size() && id(ac_cs)[idx] == id(sel_cs_g));
            bool sel_ch = ((uint8_t) (selg ? 1 : 0) != last_selg[i]);
            if (sel_ch) last_selg[i] = selg ? 1 : 0;
            if (g < 0.02f && g0 < 0.02f && !selg) {
              if (persist && !dark && last_opa[i] != 0) {
                lv_obj_add_flag(marks[i], LV_OBJ_FLAG_HIDDEN);
                if (id(atc_on)) lv_obj_add_flag(vecs[i], LV_OBJ_FLAG_HIDDEN);
                last_opa[i] = 0;
              }
              continue;
            }
            if (dark) continue;
            if (persist) {
              float go = selg ? (g < 0.25f ? 0.25f : g) : g;
              if (go < 0.02f) {
                if (last_opa[i] != 0) {
                  lv_obj_add_flag(marks[i], LV_OBJ_FLAG_HIDDEN);
                  if (id(atc_on)) lv_obj_add_flag(vecs[i], LV_OBJ_FLAG_HIDDEN);
                  last_opa[i] = 0;
                }
                continue;
              }
              // opa 量化成 8 級(~12.5%)
              uint8_t opa = (uint8_t) (go * 255.0f);
              opa = (uint8_t) ((opa / 32) * 32);
              if (opa < 32) opa = 32;
              bool need_show = (last_opa[i] == 0) || crossed || sel_ch;
              bool opa_ch = (opa != last_opa[i]) || crossed || sel_ch;
              if (!crossed && !sel_ch && opa_ch && budget <= 0) continue;  // 數值已寫,樣式下拍再補
              if (need_show) {
                lv_obj_clear_flag(marks[i], LV_OBJ_FLAG_HIDDEN);
                if (id(atc_on)) lv_obj_clear_flag(vecs[i], LV_OBJ_FLAG_HIDDEN);
              }
              if (opa_ch) {
                if (!crossed && !sel_ch) budget--;
                last_opa[i] = opa;
                lv_obj_set_style_opa(marks[i], (lv_opa_t) opa, 0);
              }
              if (crossed) {
                lv_obj_set_style_img_recolor(imgs[i], lv_color_make(0xFF, 0xFF, 0xFF), 0);
                lv_obj_set_style_img_recolor_opa(imgs[i], LV_OPA_COVER, 0);
              } else if (sel_ch || (g0 >= 0.98f && g < 0.98f)) {
                uint8_t br = selg ? 0xFF : 0x40, bg = selg ? 0xD2 : 0xFF, bb = selg ? 0x4A : 0x9A;
                lv_obj_set_style_img_recolor(imgs[i], lv_color_make(br, bg, bb), 0);
                lv_obj_set_style_img_recolor_opa(imgs[i], LV_OPA_COVER, 0);
              }
            } else {
              if (last_opa[i] != 254) {
                lv_obj_clear_flag(marks[i], LV_OBJ_FLAG_HIDDEN);
                lv_obj_set_style_opa(marks[i], LV_OPA_COVER, 0);
                last_opa[i] = 254;
              }
              uint8_t gq = (uint8_t) (g * 8.0f);   // 更粗的高亮階
              if (crossed || gq != last_gq[i] || sel_ch) {
                if (!crossed && !sel_ch && budget <= 0) continue;
                if (!crossed && !sel_ch) budget--;
                last_gq[i] = gq;
                uint8_t br = selg ? 0xFF : 0x40, bg = selg ? 0xD2 : 0xFF, bb = selg ? 0x4A : 0x9A;
                uint8_t r = br + (uint8_t) ((255 - br) * g);
                uint8_t gg = bg + (uint8_t) ((255 - bg) * g);
                uint8_t b = bb + (uint8_t) ((255 - bb) * g);
                lv_obj_set_style_img_recolor(imgs[i], lv_color_make(r, gg, b), 0);
                lv_obj_set_style_img_recolor_opa(imgs[i], LV_OPA_COVER, 0);
              }
            }
          }

  # 回波每 10 分鐘更新(開啟時)
  - interval: 600s
    then:
      - if:
          condition:
            lambda: |-
              return id(echo_on) && wifi::global_wifi_component->is_connected() &&
                     (id(backlight).current_values.is_on() || id(poll_when_off));
          then:
            - script.execute: echo_refresh
  # 每 5 秒刷新 WiFi 狀態與座標顯示(只重繪那兩行)
  - interval: 5s
    then:
      - lambda: |-
          bool up = wifi::global_wifi_component->is_connected();
          lv_label_set_text(id(wifi_icon), up ? LV_SYMBOL_WIFI : LV_SYMBOL_WARNING);
          lv_obj_set_style_text_color(id(wifi_icon), lv_color_hex(up ? 0x00E66E : 0xFF7800), 0);
      - lvgl.label.update:
          id: coords_label
          text: !lambda |-
            char buf[48];
            snprintf(buf, sizeof(buf), id(units_imperial) ? "%.4fN  %.4fE  R%.0fmi" : "%.4fN  %.4fE  R%.0fkm",
                     id(home_lat).state, id(home_lon).state, id(radar_range).state * (id(units_imperial) ? 0.6214f : 1.0f));
            return std::string(buf);

# =====================================================================
#  Hardware pin map / 硬體腳位定義
#  Board: generic "esp32-s3-5inch-rgb-001" (ESP32-S3, 16MB flash,
#  8MB octal PSRAM, 800x480 ST7262 parallel-RGB panel, GT911 touch).
#  Using a different S3 + 800x480 RGB + GT911 board? Edit the pins and
#  panel timings below to match your board's schematic - see README
#  "Compatible boards".
# =====================================================================

# ---- 字型 ----
font:
  - file: "gfonts://Roboto Condensed"
    id: font_small
    size: ${f_small}
    # 喇叭名稱常為中文:繁體=Big5 一級常用字、簡體=GB2312 一級扣重複
    # (tools/make_cjk_glyphs.py 產生)
    extras:
      - file: "gfonts://Noto Sans TC"
        glyphs:
          - !include ../cjk_glyphs.yaml
      - file: "gfonts://Noto Sans SC"
        glyphs:
          - !include ../cjk_glyphs_sc.yaml
  - file: "gfonts://Roboto Condensed"
    id: font_mid
    size: ${f_mid}
  - file: "gfonts://Roboto Condensed@700"
    id: font_clock
    size: ${f_clock}
    glyphs: "0123456789:- ALMR"
  - file: "gfonts://Roboto Mono"
    id: font_mono
    size: ${f_mono}
  - file: "gfonts://Roboto Condensed"
    id: font_tiny
    size: ${f_tiny}
    # ATC 標籤的爬升/下降箭頭:Roboto Condensed 沒有 U+2191/2193。
    # ESPHome extras 的 offset_y 用「該字型自己的 ascender」算,行高卻依主字型,
    # 所以 extras 字型 14px 的 ascender 必須 ≈13 才對得齊基線。
    # DejaVu Sans:ascender=13(吻合)、箭頭 5px 寬 1bpp 仍有箭頭形;
    # Noto Sans Symbols ascender=21 → 箭頭整根掉到基線下;gfonts Roboto 缺這兩字。
    # (字型檔取自 LVGL 內附,Bitstream Vera/DejaVu 授權,可自由散布)
    extras:
      - file: "fonts/DejaVuSans.ttf"
        glyphs: ["↑", "↓"]

image:
  - file: plane.png
    id: plane_img
    type: RGB565
    transparency: alpha_channel
